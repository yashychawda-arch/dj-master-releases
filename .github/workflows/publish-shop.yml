name: Publish shop release
on:
  push:
    branches: [claude/dazzling-allen-xbipfw]
    paths: [shop-release/**, .github/workflows/publish-shop.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the installers against their recorded fingerprints
        working-directory: shop-release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish shop-v<VERSION>
        working-directory: shop-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "bad version: $v"; exit 1; }
          gh release create "shop-v$v" --target "$GITHUB_SHA" \
            --title "DJ Master $v — $(head -n1 NOTES.md | sed 's/\.$//')" \
            --notes-file NOTES.md \
            "Yoshi.C.s.DJ.Master.$v.Setup.exe" "Yoshi.C.s.DJ.Master.$v.Mac.zip"
