<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Deck</title>
<style>
  :root {
    --bg: #05070f;
    --panel: rgba(9, 14, 30, 0.8);
    --line: rgba(120, 150, 230, 0.16);
    --text: #e6ecff;
    --dim: #8f9cc4;
    --cyan: #37d7ff;
    --green: #3ddc84;
    --red: #ff5c7a;
    --grey: #9aa4b2;
    --amber: #f5b14c;
    --violet: #b48cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .hud { position: fixed; top: 14px; left: 16px; pointer-events: none; z-index: 2; padding: 9px 14px; border-radius: 12px;
    background: rgba(5, 8, 20, 0.5); backdrop-filter: blur(6px); }
  .hud h1 { margin: 0; font-size: 19px; letter-spacing: 0.22em; font-weight: 700; }
  .hud .sub { color: var(--dim); margin-top: 4px; font-size: 14px; }
  .bar { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 3; flex-wrap: wrap; justify-content: flex-end; }
  .bar button { background: rgba(20, 30, 60, 0.75); color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .bar button:hover { border-color: rgba(120, 150, 230, 0.55); }
  .bar button kbd { color: var(--dim); font: inherit; margin-left: 6px; }
  .themes { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: rgba(20, 30, 60, 0.75); }
  .bar .themes button { border: 0; border-radius: 0; background: transparent; }
  .bar .themes button + button { border-left: 1px solid var(--line); }
  .bar .themes button.on { background: rgba(90, 130, 255, 0.38); }
  #panel { position: fixed; top: 62px; right: 16px; bottom: 44px; width: min(430px, 36vw); overflow: auto; z-index: 2;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(10px); }
  body.nopanel #panel { display: none; }
  .sess + .sess { margin-top: 22px; }
  .sess h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); font-weight: 600;
    display: flex; justify-content: space-between; gap: 8px; }
  .sess h2 .main { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .sess h2 .main.on { color: var(--violet); }
  .group { margin: 10px 0 2px; font-size: 12px; color: var(--dim); }
  .ag { padding: 9px 0 8px; border-top: 1px solid var(--line); }
  .ag .t { font-weight: 600; display: flex; gap: 7px; align-items: baseline; }
  .ag .t .n { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .ag .t .ty { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: auto; white-space: nowrap; }
  .ag .now { margin-top: 2px; }
  .ag .meta { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ag.idle .t .n { color: var(--amber); }
  .prog { height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; margin-top: 7px; overflow: hidden; position: relative; }
  .prog i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); border-radius: 2px; transition: width 0.8s ease; }
  .prog.unknown i { width: 28%; animation: slide 1.8s ease-in-out infinite; }
  @keyframes slide { 0% { left: -28%; } 100% { left: 100%; } }
  .fin { display: flex; gap: 8px; font-size: 13px; color: var(--dim); padding: 3px 0; }
  .fin .m { width: 1em; text-align: center; }
  .fin.done .m { color: var(--green); } .fin.failed .m { color: var(--red); } .fin.stopped .m { color: var(--grey); }
  .types { color: var(--dim); font-size: 12.5px; }
  .empty { color: var(--dim); }
  #status { position: fixed; left: 16px; bottom: 14px; color: var(--dim); font-size: 12px; z-index: 2; padding: 4px 10px; border-radius: 8px;
    background: rgba(5, 8, 20, 0.5); }
  #status.warn { color: var(--amber); }
  #note { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: 520px; text-align: center; color: var(--dim);
    font-size: 15px; z-index: 1; display: none; }

  /* Labels that float over the 3D scene. */
  .lbl { font-family: inherit; white-space: nowrap; text-align: center; text-shadow: 0 1px 3px #000, 0 0 10px #000; transform: translateY(-50%); }
  .lbl.agent .n { font-size: 19px; font-weight: 700; color: var(--cyan); }
  .lbl.agent.idle .n { color: var(--amber); }
  .lbl.agent .d { font-size: 15px; font-weight: 600; color: #f0f8ff; max-width: 230px; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
  .lbl.agent .a { font-size: 12.5px; color: #cfe6ff; max-width: 230px; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
  .lbl.agent .m { font-size: 12px; color: #a9b6dc; }
  .lbl .pb { width: 140px; height: 4px; margin: 5px auto 0; background: rgba(255, 255, 255, 0.18); border-radius: 2px; overflow: hidden; position: relative; }
  .lbl .pb i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); border-radius: 2px; }
  .lbl.agent.idle .pb i { background: var(--amber); }
  .lbl .pb.unknown i { width: 30%; animation: slide 1.6s ease-in-out infinite; }
  .lbl.hub { font-size: 14px; color: #d4c2ff; }
  .lbl.hub.off { color: #a3a9c6; }
  .lbl.small { font-size: 12px; color: #c0c8e4; }
  .lbl.fin.done { color: var(--green); } .lbl.fin.failed { color: var(--red); } .lbl.fin.stopped { color: var(--grey); }
  .lbl.sname { font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase; color: #b3c3ff; font-weight: 600; }
  .lbl.board { font-size: 12.5px; color: #e6ecff; background: rgba(12, 6, 30, 0.72); border: 1px solid rgba(255, 60, 200, 0.45);
    border-radius: 8px; padding: 5px 10px; text-shadow: none; white-space: normal; max-width: 300px; }
  .lbl.board b { color: #ff7ad9; font-weight: 600; letter-spacing: 0.06em; }
  body[data-look="workshop"] .lbl.board { background: rgba(30, 22, 14, 0.72); border-color: rgba(255, 200, 120, 0.45); }
  body[data-look="workshop"] .lbl.board b { color: #ffd27a; }
  body[data-look="decks"] .lbl.board { border-color: rgba(120, 200, 255, 0.45); }
  body[data-look="decks"] .lbl.board b { color: #7fdcff; }
  @media (prefers-reduced-motion: reduce) { .prog.unknown i, .lbl .pb.unknown i { animation: none; left: 0; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="hud"><h1>AGENT DECK</h1><div class="sub" id="sub">Waiting for data…</div></div>
<div class="bar">
  <div class="themes" id="themes" title="Pick a look (1-4, or T to cycle)"></div>
  <button id="bRotate" title="Move the camera by itself">Camera<kbd>R</kbd></button>
  <button id="bPanel" title="Show or hide the list">List<kbd>L</kbd></button>
  <button id="bFull" title="Fill the screen">Fullscreen<kbd>F</kbd></button>
</div>
<div id="panel"></div>
<div id="note"></div>
<div id="status">Connecting…</div>

<script>
// Data, the list and the controls. The Claude sessions write deck-data.js next to this page; it is read
// again every second. Plain script, so the list keeps working even when the 3D part cannot load.
// Open the page with #demo on the end to see it run on made-up agents.
(() => {
  const STALE_MS = 45000
  const THEMES = [['decks', 'Decks'], ['circuit', 'Circuit'], ['workshop', 'Workshop'], ['stage', 'Stage']]
  const state = { data: null, receivedAt: 0 }
  window.__deck = state

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`)
  const fmt = ms => {
    const s = Math.max(0, Math.round(ms / 1000))
    if (s < 60) return `${s}s`
    const m = Math.floor(s / 60)
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`
  }
  window.__deckFmt = fmt
  window.__deckEsc = esc

  // --- Theme choice: remembered in this browser, or named in the address (#theme=circuit) ---------------
  const fromHash = /theme=(\w+)/.exec(location.hash)?.[1]
  let saved = null
  try { saved = localStorage.getItem('agent-deck-theme') } catch {}
  let theme = THEMES.some(t => t[0] === fromHash) ? fromHash : THEMES.some(t => t[0] === saved) ? saved : THEMES[0][0]
  window.__deckThemeId = theme
  const bar = document.getElementById('themes')
  function drawThemes() {
    bar.innerHTML = THEMES.map(([id, name], i) =>
      `<button data-id="${id}" class="${id === theme ? 'on' : ''}" title="${name} (${i + 1})">${name}</button>`).join('')
  }
  function pick(id) {
    theme = id
    try { localStorage.setItem('agent-deck-theme', id) } catch {}
    drawThemes()
    window.__deckScene?.setTheme(id)
  }
  bar.addEventListener('click', e => { const id = e.target.closest('button')?.dataset.id; if (id) pick(id) })
  drawThemes()

  function liveSessions() {
    const all = Object.values(state.data?.sessions ?? {})
    return all.filter(s => Date.now() - s.updatedAt < STALE_MS).sort((a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id))
  }
  window.__deckSessions = liveSessions

  function render() {
    const sessions = liveSessions()
    const now = Date.now()
    let working = 0
    let finished = 0
    const html = sessions.map(s => {
      const live = s.agents.filter(a => a.status === 'running' || a.status === 'idle')
      const done = s.agents.filter(a => !(a.status === 'running' || a.status === 'idle'))
      working += live.length
      finished += done.length
      const rows = live.map(a => {
        const elapsed = a.startedAt ? `${fmt(now - a.startedAt)} so far` : 'running since before the deck loaded'
        const known = typeof a.est?.fraction === 'number'
        const bar = known
          ? `<div class="prog"><i style="width:${Math.round(Math.min(1, a.est.fraction) * 100)}%"></i></div>`
          : `<div class="prog unknown"><i></i></div>`
        return `<div class="ag ${a.status}">
          <div class="t"><span class="n">#${a.n}</span><span>${esc(a.description)}</span><span class="ty">${esc(a.type)}</span></div>
          <div class="now">${a.status === 'idle' ? 'Waiting for a message' : esc(a.action || 'Starting up')}</div>
          <div class="meta">${elapsed} · ${esc(a.est?.text ?? '')} · ${a.tools} tool calls</div>${bar}</div>`
      }).join('')
      const fins = done.map(a => {
        const mark = a.status === 'done' ? '✓' : a.status === 'failed' ? '✕' : '■'
        const took = a.startedAt && a.endedAt ? ` · ${fmt(a.endedAt - a.startedAt)}` : ''
        return `<div class="fin ${a.status}"><span class="m">${mark}</span><span>${esc(a.description)}${took}</span></div>`
      }).join('')
      const main = s.main.isWorking ? `Working${s.main.action ? `: ${esc(s.main.action)}` : ''}` : 'Waiting for you'
      return `<div class="sess">
        <h2><span>${esc(s.name)}</span><span class="main ${s.main.isWorking ? 'on' : ''}">${main}</span></h2>
        ${rows || '<div class="empty">No agents working.</div>'}
        ${fins ? `<div class="group">Finished</div>${fins}` : ''}
        <div class="group">Ready to start</div><div class="types">${s.types.map(esc).join(' · ') || 'Listed after the session’s first turn.'}</div>
      </div>`
    }).join('')

    document.getElementById('panel').innerHTML =
      html || '<div class="empty">No Claude session is sending to this window. In a session, press <b>Pop out</b> on the Agent deck pane or type <b>/agent-deck-window</b>.</div>'
    document.getElementById('sub').textContent =
      `${sessions.length} session${sessions.length === 1 ? '' : 's'} · ${working} working · ${finished} finished`

    const age = now - state.receivedAt
    const status = document.getElementById('status')
    status.className = state.receivedAt && age < 5000 ? '' : 'warn'
    status.textContent = demo ? 'Demo: made-up agents, to try the looks'
      : !state.receivedAt ? 'No data yet: open it from a Claude session (Pop out, or /agent-deck-window).'
      : age < 5000 ? `Live · ${new Date().toLocaleTimeString()}` : `No update for ${fmt(age)}. Is a session still open?`

    window.__deckScene?.update(sessions)
  }

  window.__deckData = d => {
    state.data = d
    state.receivedAt = Date.now()
  }

  // --- Made-up agents for #demo -------------------------------------------------------------------------
  const demo = /demo/.test(location.hash)
  const demoStart = Date.now()
  function demoData() {
    const t = Date.now()
    const agent = (id, n, description, type, action, cycleMs, offsetMs, steps) => {
      const age = (t - demoStart + offsetMs) % cycleMs
      const f = age / cycleMs
      const est = steps
        ? { text: `~${fmt(cycleMs - age)} left (${Math.floor(f * steps)}/${steps} steps)`, fraction: f }
        : { text: 'no estimate yet' }
      return { id, n, description, type, status: 'running', action, startedAt: t - age, tools: 3 + Math.floor(age / 4000), est }
    }
    const done = (id, description, status) => ({ id, n: 1, description, type: 'general-purpose', status,
      startedAt: demoStart - 400000, endedAt: demoStart - 120000, tools: 20, est: { text: status } })
    const types = ['general-purpose', 'Explore', 'Plan', 'claude-code-guide']
    return { v: 1, sessions: {
      s1: { id: 's1', name: 'licence-server', updatedAt: t, types,
        main: { isWorking: true, action: 'Checking the 15s cut' },
        agents: [
          agent('a1', 1, 'Stem Splitter promo videos', 'general-purpose', 'Rendering the 28s cut', 90000, 30000, 7),
          agent('a2', 2, 'DJ Master promo videos', 'general-purpose', 'Filming the requests promo', 120000, 0, 0),
          agent('a3', 3, 'Find licence checks', 'Explore', 'Searching the code for "activate"', 60000, 45000, 4),
          done('d1', 'Fix installer icon', 'done'),
          done('d2', 'Sign the Mac build', 'failed'),
        ] },
    } }
  }

  function poll() {
    if (demo) { window.__deckData(demoData()); return }
    const s = document.createElement('script')
    s.src = `deck-data.js?t=${Date.now()}`
    s.onload = s.onerror = () => s.remove()
    document.head.appendChild(s)
  }
  poll()
  setInterval(() => { poll(); render() }, 1000)
  render()

  const toggleFull = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()
  const togglePanel = () => { document.body.classList.toggle('nopanel'); window.__deckScene?.resize() }
  const toggleRotate = () => window.__deckScene?.toggleRotate()
  document.getElementById('bFull').onclick = toggleFull
  document.getElementById('bPanel').onclick = togglePanel
  document.getElementById('bRotate').onclick = toggleRotate
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return
    const k = e.key.toLowerCase()
    if (k === 'f') toggleFull()
    else if (k === 'l') togglePanel()
    else if (k === 'r') toggleRotate()
    else if (k === 't') pick(THEMES[(THEMES.findIndex(x => x[0] === theme) + 1) % THEMES.length][0])
    else if (/^[1-9]$/.test(k) && THEMES[Number(k) - 1]) pick(THEMES[Number(k) - 1][0])
  })

  setTimeout(() => {
    if (window.__deckScene) return
    const note = document.getElementById('note')
    note.style.display = 'block'
    note.textContent = 'The 3D view could not load (it fetches three.js from the internet the first time). The list on the right still updates.'
  }, 8000)
})()
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const fmt = window.__deckFmt
const esc = window.__deckEsc
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches

const COLOR = {
  running: 0x37d7ff, idle: 0xf5b14c, done: 0x3ddc84, failed: 0xff5c7a, stopped: 0x9aa4b2,
  type: 0x7b86a6, main: 0xb48cff, mainOff: 0x5d6280, rim: 0x3a7bff,
}

// --- Renderer, camera, effects ----------------------------------------------
const stage = document.getElementById('stage')
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
stage.appendChild(renderer.domElement)

const labels = new CSS2DRenderer({ element: document.getElementById('labels') })
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1200)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.autoRotateSpeed = 0.45
controls.maxPolarAngle = Math.PI * 0.47
controls.minDistance = 5
controls.maxDistance = 160

let rotateWanted = !calm
let interacting = false
let resumeTimer = 0
let zoomed = false
controls.addEventListener('start', () => { interacting = true; controls.autoRotate = false; clearTimeout(resumeTimer) })
controls.addEventListener('end', () => {
  resumeTimer = setTimeout(() => { interacting = false; controls.autoRotate = rotateWanted && !theme?.sway }, 8000)
})
renderer.domElement.addEventListener('wheel', () => { zoomed = true }, { passive: true })

const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.5, 0.22)
composer.addPass(bloom)
composer.addPass(new OutputPass())

// --- Small shared helpers ---------------------------------------------------
const shared = g => { g.userData.shared = true; return g }
const GEO = {
  box: shared(new THREE.BoxGeometry(1, 1, 1)),
  boxUp: shared(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0)),
  edgesUp: shared(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0))),
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15, ...o })
const glow = (color, o = {}) => new THREE.MeshBasicMaterial({ color, ...o })
function cube(w, h, d, material, y = h / 2) {
  const m = new THREE.Mesh(GEO.box, material)
  m.scale.set(w, h, d)
  m.position.y = y
  return m
}
const isLive = a => a.status === 'running' || a.status === 'idle'
const liveOf = s => s.agents.filter(isLive)
const doneOf = s => s.agents.filter(a => !isLive(a))
const tint = a => (a.status === 'idle' ? COLOR.idle : COLOR.running)
const fraction = a => (typeof a.est?.fraction === 'number' ? Math.max(0, Math.min(1, a.est.fraction)) : null)
const easeTo = (cur, target, dt, rate = 4) => cur + (target - cur) * (1 - Math.exp(-rate * dt))

function label(html, cls) {
  const el = document.createElement('div')
  el.className = `lbl ${cls}`
  el.innerHTML = html
  return new CSS2DObject(el)
}

function agentHtml(a, now, { meta = true } = {}) {
  const f = fraction(a)
  const pct = f === null ? '' : ` · ${Math.round(f * 100)}%`
  const elapsed = a.startedAt ? fmt(now - a.startedAt) : 'since before the deck loaded'
  return `<div class="n">#${a.n}${pct}</div><div class="d">${esc(a.description)}</div>` +
    `<div class="a">${a.status === 'idle' ? 'Waiting for a message' : esc(a.action || 'Starting up')}</div>` +
    (meta ? `<div class="m">${elapsed} · ${esc(a.est?.text ?? '')}</div>` : '') +
    `<div class="pb${f === null ? ' unknown' : ''}"><i style="width:${Math.round((f ?? 0.3) * 100)}%"></i></div>`
}
function setAgentLabel(tag, a, now, opts) {
  tag.element.className = `lbl agent ${a.status}`
  tag.element.innerHTML = agentHtml(a, now, opts)
}
function finishedSummary(list) {
  if (list.length === 0) return ''
  const count = st => list.filter(a => a.status === st).length
  const parts = [['done', '✓'], ['failed', '✕'], ['stopped', '■']].filter(([st]) => count(st)).map(([st, m]) => `${m} ${count(st)}`)
  return `<b>FINISHED</b> ${parts.join(' · ')}<br>${list.slice(0, 4).map(a => esc(a.description)).join('<br>')}`
}
const typesHtml = types => `<b>READY TO START</b><br>${types.slice(0, 8).map(esc).join(' · ') || 'listed after the first turn'}`
const hubText = s => (s.main.isWorking ? `Main session · ${esc(s.main.action || 'working')}` : 'Main session · waiting for you')

function disposeTree(obj) {
  obj.traverse(o => {
    if (o.isCSS2DObject) o.element.remove()
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose()
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : []
    for (const m of mats) if (!m.userData.shared) m.dispose()
  })
}

/** Adds what is new and removes what is gone, keyed by `id`; `make` returns { group, ... }. */
function sync(map, list, make, parent) {
  const ids = new Set(list.map(x => x.id))
  for (const [id, item] of map) {
    if (!ids.has(id)) {
      disposeTree(item.group)
      parent.remove(item.group)
      map.delete(id)
    }
  }
  for (const x of list) {
    if (map.has(x.id)) continue
    const item = make(x)
    parent.add(item.group)
    map.set(x.id, item)
  }
}

function ringPositions(count, radius, offset) {
  if (count === 1 && radius < 4) return [[0, radius]]
  return Array.from({ length: count }, (_, i) => {
    const a = offset + (i / count) * Math.PI * 2
    return [Math.cos(a) * radius, Math.sin(a) * radius]
  })
}

function seeded(text) {
  let h = 2166136261
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619)
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822507)
    h = Math.imul(h ^ (h >>> 13), 3266489909)
    return ((h ^= h >>> 16) >>> 0) / 4294967296
  }
}

/** A sky dome shaded from horizon to zenith. */
function skyDome(stops) {
  const g = new THREE.SphereGeometry(600, 48, 24)
  const pos = g.attributes.position
  const colors = []
  const c = new THREE.Color()
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 600
    let j = 0
    while (j < stops.length - 2 && y > stops[j + 1][0]) j++
    const [y0, c0] = stops[j]
    const [y1, c1] = stops[j + 1]
    const k = Math.max(0, Math.min(1, (y - y0) / (y1 - y0)))
    c.set(c0).lerp(new THREE.Color(c1), k)
    colors.push(c.r, c.g, c.b)
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }))
}

/** A flat arc on the floor: `part` of a full turn, from 12 o'clock clockwise. */
function arcGeometry(inner, outer, part) {
  const len = Math.max(0.001, Math.min(1, part)) * Math.PI * 2
  return new THREE.RingGeometry(inner, outer, 64, 1, Math.PI / 2 - len, len).rotateX(-Math.PI / 2)
}

// ============================================================================
// Theme 1: DECKS. A DJ booth per session. Every working agent is a turntable:
// the record spins while it works and the tonearm crosses the record as it
// gets through its steps. The main session is the mixer, its meters moving
// while it works. Finished agents and ready agent types are record crates.
// ============================================================================
function makeTurntable() {
  const group = new THREE.Group()
  group.position.y = 1.0
  group.scale.setScalar(0.01)
  const metal = std(0x2a2836, { metalness: 0.55, roughness: 0.38 })
  group.add(cube(2.3, 0.16, 2.3, metal, 0.08))
  const platter = new THREE.Mesh(new THREE.CylinderGeometry(1.02, 1.02, 0.06, 64), std(0xa7adbf, { metalness: 0.85, roughness: 0.28 }))
  platter.position.y = 0.19
  group.add(platter)

  const record = new THREE.Group()
  record.position.y = 0.235
  group.add(record)
  record.add(new THREE.Mesh(new THREE.CylinderGeometry(0.97, 0.97, 0.025, 64), std(0x060608, { roughness: 0.22, metalness: 0.35 })))
  const grooveMat = glow(0x2c2c3a)
  for (const r of [0.5, 0.66, 0.82]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.005, r + 0.005, 64).rotateX(-Math.PI / 2), grooveMat)
    ring.position.y = 0.014
    record.add(ring)
  }
  const labelMat = std(COLOR.running, { emissive: COLOR.running, emissiveIntensity: 0.7 })
  const centre = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 32), labelMat)
  centre.position.y = 0.006
  record.add(centre)
  const mark = cube(0.16, 0.012, 0.05, glow(0xffffff), 0.025)
  mark.position.x = 0.16
  record.add(mark)

  const trackMat = glow(0x232a44)
  const track = new THREE.Mesh(new THREE.RingGeometry(1.06, 1.13, 64).rotateX(-Math.PI / 2), trackMat)
  track.position.y = 0.165
  group.add(track)
  const arcMat = glow(COLOR.running)
  const arc = new THREE.Mesh(arcGeometry(1.06, 1.13, 0.001), arcMat)
  arc.position.y = 0.167
  group.add(arc)

  const pivot = new THREE.Group()
  pivot.position.set(0.95, 0.2, -0.95)
  group.add(pivot)
  const silver = std(0xd7dbe6, { metalness: 0.9, roughness: 0.25 })
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.22, 20), silver)
  post.position.y = 0.06
  pivot.add(post)
  const arm = cube(0.045, 0.045, 1.42, silver, 0.17)
  arm.position.z = 0.71
  pivot.add(arm)
  const head = cube(0.13, 0.05, 0.22, std(0x101015), 0.15)
  head.position.z = 1.45
  pivot.add(head)

  const tag = label('', 'agent')
  tag.position.y = 2.1
  group.add(tag)

  let known = false
  let f = 0
  let lastPart = -1
  let spin = 3.6
  let angle = -0.02
  let phase = Math.random() * 10
  return {
    group,
    update(a, now, row) {
      const colour = tint(a)
      labelMat.color.setHex(colour)
      labelMat.emissive.setHex(colour)
      arcMat.color.setHex(colour)
      const got = fraction(a)
      known = got !== null
      f = got ?? 0
      const part = known ? Math.round(f * 100) / 100 : 0.25
      if (part !== lastPart) {
        arc.geometry.dispose()
        arc.geometry = arcGeometry(1.06, 1.13, part)
        lastPart = part
      }
      spin = a.status === 'idle' ? 0.5 : 3.6
      tag.position.y = row % 2 ? 2.9 : 2.0
      setAgentLabel(tag, a, now, { meta: false })
    },
    tick(dt, t) {
      group.scale.setScalar(easeTo(group.scale.x, 1, dt, 5))
      if (!calm) record.rotation.y -= dt * spin
      if (!known && !calm) arc.rotation.y -= dt * 1.4
      else arc.rotation.y = 0
      const p = known ? f : 0.5 + 0.08 * Math.sin(t * 0.7 + phase)
      angle = easeTo(angle, -0.08 - 0.44 * p, dt, 2)
      pivot.rotation.y = angle
    },
  }
}

function makeCrate(colorFor) {
  const group = new THREE.Group()
  const wood = std(0x3a2a1e, { roughness: 0.8 })
  group.add(cube(1.25, 0.08, 1.25, wood, 0.04))
  for (const [x, z, w, d] of [[0, 0.6, 1.25, 0.06], [0, -0.6, 1.25, 0.06], [0.6, 0, 0.06, 1.25], [-0.6, 0, 0.06, 1.25]]) {
    const wall = cube(w, 0.55, d, wood, 0.3)
    wall.position.x = x
    wall.position.z = z
    group.add(wall)
  }
  const sleeves = new THREE.Group()
  group.add(sleeves)
  const tag = label('', 'board')
  tag.position.y = 1.9
  group.add(tag)
  let lastKey = ''
  return {
    group,
    tag,
    fill(items) {
      const key = items.map(i => `${i.id}:${i.status ?? ''}`).join('|')
      if (key === lastKey) return
      lastKey = key
      disposeTree(sleeves)
      sleeves.clear()
      items.slice(0, 9).forEach((item, i) => {
        const colour = colorFor(item)
        const sleeve = cube(1.0, 1.0, 0.035, std(colour, { emissive: colour, emissiveIntensity: 0.25, roughness: 0.5 }), 0.58)
        sleeve.position.z = 0.42 - i * 0.1
        sleeve.rotation.x = -0.18
        sleeves.add(sleeve)
      })
    },
  }
}

function decksUnit() {
  const group = new THREE.Group()
  const table = cube(8, 1.0, 2.6, std(0x15121f, { roughness: 0.42, metalness: 0.5 }))
  group.add(table)
  const strip = cube(8, 0.05, 0.05, glow(0x37d7ff), 0.98)
  strip.position.z = 1.31
  const stripLow = cube(8, 0.04, 0.04, glow(0xff2bd6), 0.06)
  stripLow.position.z = 1.31
  group.add(strip, stripLow)

  // The mixer: the main session.
  const mixer = new THREE.Group()
  mixer.position.y = 1.0
  group.add(mixer)
  mixer.add(cube(1.8, 0.22, 2.1, std(0x23212f, { metalness: 0.6, roughness: 0.35 }), 0.11))
  const knobMat = std(0xd0d4e0, { metalness: 0.8, roughness: 0.3 })
  const knobGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.09, 16)
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 4; c++) {
      const k = new THREE.Mesh(knobGeo, knobMat)
      k.position.set(-0.6 + c * 0.4, 0.27, -0.15 + r * 0.32)
      mixer.add(k)
    }
  }
  const faderMat = std(0x0c0c12)
  for (let c = 0; c < 4; c++) {
    const slot = cube(0.05, 0.02, 0.5, faderMat, 0.23)
    slot.position.set(-0.6 + c * 0.4, 0, 0.8)
    mixer.add(slot)
  }
  const meterMat = glow(COLOR.main)
  const meters = Array.from({ length: 10 }, (_, i) => {
    const bar = new THREE.Mesh(GEO.boxUp, meterMat)
    bar.scale.set(0.1, 0.05, 0.1)
    bar.position.set(-0.72 + i * 0.16, 0.22, -0.78)
    mixer.add(bar)
    return bar
  })
  const hubTag = label('', 'hub')
  hubTag.position.set(0, -0.15, 1.75)
  mixer.add(hubTag)

  const finCrate = makeCrate(a => COLOR[a.status] ?? COLOR.stopped)
  const typeCrate = makeCrate(() => COLOR.type)
  group.add(finCrate.group, typeCrate.group)
  const nameTag = label('', 'sname')
  nameTag.position.set(0, 0.25, 2.2)
  group.add(nameTag)

  const decks = new Map()
  let working = false
  let half = 4
  return {
    group,
    update(s, now) {
      working = s.main.isWorking
      meterMat.color.setHex(working ? COLOR.main : COLOR.mainOff)
      hubTag.element.className = `lbl hub${working ? '' : ' off'}`
      hubTag.element.innerHTML = hubText(s)
      nameTag.element.textContent = s.name

      const live = liveOf(s)
      sync(decks, live, () => makeTurntable(), group)
      live.forEach((a, i) => {
        const side = i % 2 === 0 ? 1 : -1
        const deck = decks.get(a.id)
        deck.goal = side * (2.3 + Math.floor(i / 2) * 2.6)
        deck.update(a, now, Math.floor(i / 2))
      })
      half = Math.max(3.6, 2.3 + Math.floor(Math.max(0, live.length - 1) / 2) * 2.6 + 1.35)

      const fin = doneOf(s)
      finCrate.fill(fin)
      finCrate.tag.element.innerHTML = finishedSummary(fin) || '<b>FINISHED</b> none yet'
      typeCrate.fill(s.types.map(name => ({ id: name })))
      typeCrate.tag.element.innerHTML = typesHtml(s.types)
    },
    tick(dt, t) {
      const w = easeTo(table.scale.x, half * 2, dt, 3)
      table.scale.x = strip.scale.x = stripLow.scale.x = w
      finCrate.group.position.set(-(w / 2 + 1.3), 0, 0.6)
      typeCrate.group.position.set(w / 2 + 1.3, 0, 0.6)
      meters.forEach((bar, i) => {
        const level = working && !calm ? 0.08 + 0.5 * Math.abs(Math.sin(t * 5.5 + i * 0.8)) * (0.55 + 0.45 * Math.sin(t * 2.1 + i)) : 0.04
        bar.scale.y = easeTo(bar.scale.y, level, dt, 12)
      })
      for (const deck of decks.values()) {
        deck.group.position.x = easeTo(deck.group.position.x, deck.goal ?? 0, dt, 3)
        deck.tick(dt, t)
      }
    },
  }
}

// ============================================================================
// Theme 2: CIRCUIT. A synthwave racetrack per session under a striped sun.
// Every working agent has its own lane; its pod sits as far round the lap as
// the agent has got, the glowing trail behind it the distance covered. With
// nothing to measure, the pod keeps lapping with a short comet tail.
// ============================================================================
const laneR = k => [4.4 + k * 0.85, 2.3 + k * 0.85]
function lanePoint(k, u, out = new THREE.Vector3()) {
  const [rx, rz] = laneR(k)
  const a = Math.PI / 2 + u * Math.PI * 2
  return out.set(Math.cos(a) * rx, 0, Math.sin(a) * rz)
}
function laneHeading(k, u) {
  const [rx, rz] = laneR(k)
  const a = Math.PI / 2 + u * Math.PI * 2
  return Math.atan2(-Math.sin(a) * rx, Math.cos(a) * rz)
}

function makePod(lane) {
  const group = new THREE.Group()
  const body = new THREE.Group()
  group.add(body)
  const mat = std(COLOR.running, { emissive: COLOR.running, emissiveIntensity: 1.1, roughness: 0.3 })
  const hull = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.55, 4, 14).rotateX(Math.PI / 2), mat)
  hull.position.y = 0.32
  body.add(hull)
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), std(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.6 }))
  canopy.position.set(0, 0.44, 0.05)
  body.add(canopy)
  const fin = cube(0.03, 0.22, 0.2, mat, 0.5)
  fin.position.z = -0.32
  body.add(fin)
  const shadowMat = glow(COLOR.running, { transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false })
  const halo = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24).rotateX(-Math.PI / 2), shadowMat)
  halo.position.y = 0.03
  group.add(halo)
  const tag = label('', 'agent')
  tag.position.y = 1.55
  group.add(tag)

  // The trail: a flat ribbon on the lane, bright at the pod and fading behind it.
  const N = 90
  const trailGeo = new THREE.BufferGeometry()
  trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(N * 2 * 3), 3))
  trailGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(N * 2 * 3), 3))
  const idx = []
  for (let i = 0; i < N - 1; i++) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2)
  trailGeo.setIndex(idx)
  const trail = new THREE.Mesh(trailGeo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }))
  trail.frustumCulled = false

  const colour = new THREE.Color(COLOR.running)
  const p = new THREE.Vector3()
  const q = new THREE.Vector3()
  let known = false
  let target = 0
  let u = 0
  const phase = Math.random()
  function drawTrail(u0, u1) {
    const pos = trailGeo.attributes.position
    const col = trailGeo.attributes.color
    for (let i = 0; i < N; i++) {
      const k = i / (N - 1)
      const uu = u0 + (u1 - u0) * k
      lanePoint(lane.k, uu, p)
      lanePoint(lane.k, uu + 0.002, q)
      const dx = q.x - p.x
      const dz = q.z - p.z
      const len = Math.hypot(dx, dz) || 1
      const nx = (-dz / len) * 0.09
      const nz = (dx / len) * 0.09
      pos.setXYZ(i * 2, p.x + nx, 0.04, p.z + nz)
      pos.setXYZ(i * 2 + 1, p.x - nx, 0.04, p.z - nz)
      const bright = known ? 0.25 + 0.75 * k : k * k
      col.setXYZ(i * 2, colour.r * bright, colour.g * bright, colour.b * bright)
      col.setXYZ(i * 2 + 1, colour.r * bright, colour.g * bright, colour.b * bright)
    }
    pos.needsUpdate = true
    col.needsUpdate = true
  }

  return {
    group,
    trail,
    lane,
    tagHeight(y) { tag.position.y = y },
    update(a, now) {
      colour.setHex(tint(a))
      mat.color.copy(colour)
      mat.emissive.copy(colour)
      shadowMat.color.copy(colour)
      const f = fraction(a)
      known = f !== null
      target = f ?? 0
      setAgentLabel(tag, a, now, { meta: false })
    },
    tick(dt, t) {
      if (known) u = easeTo(u, Math.max(0.004, target), dt, 1.5)
      else u = calm ? 0.25 : (u + dt * 0.065) % 1
      lanePoint(lane.k, u, p)
      group.position.copy(p)
      body.rotation.y = laneHeading(lane.k, u)
      body.position.y = calm ? 0 : 0.05 * Math.sin(t * 3 + phase * 6)
      drawTrail(known ? 0 : u - 0.3, u)
    },
  }
}

function circuitUnit() {
  const group = new THREE.Group()
  const track = new THREE.Group()
  group.add(track)
  let laneCount = -1

  function buildTrack(n) {
    disposeTree(track)
    track.clear()
    const lanes = Math.max(1, n)
    const [ix, iz] = laneR(0)
    const [ox, oz] = laneR(lanes - 1)
    const ellipse = (rx, rz, path) => {
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2
        const x = Math.cos(a) * rx
        const y = Math.sin(a) * rz
        i ? path.lineTo(x, y) : path.moveTo(x, y)
      }
      return path
    }
    const shape = ellipse(ox + 0.5, oz + 0.5, new THREE.Shape())
    shape.holes.push(ellipse(ix - 0.5, iz - 0.5, new THREE.Path()))
    const surface = new THREE.Mesh(new THREE.ShapeGeometry(shape, 64).rotateX(-Math.PI / 2),
      std(0x120728, { roughness: 0.35, metalness: 0.6, transparent: true, opacity: 0.92 }))
    surface.position.y = 0.01
    track.add(surface)
    const edge = (rx, rz, color, opacity) => {
      const pts = Array.from({ length: 129 }, (_, i) => {
        const a = (i / 128) * Math.PI * 2
        return new THREE.Vector3(Math.cos(a) * rx, 0.03, Math.sin(a) * rz)
      })
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity }))
    }
    track.add(edge(ox + 0.5, oz + 0.5, 0xff2bd6, 1), edge(ix - 0.5, iz - 0.5, 0xff2bd6, 1))
    for (let k = 0; k < lanes - 1; k++) {
      const [rx, rz] = laneR(k)
      track.add(edge(rx + 0.425, rz + 0.425, 0x37d7ff, 0.35))
    }
    // Start / finish: a chequered strip across the lanes at the front.
    const white = glow(0xf4f4ff)
    const black = glow(0x14101f)
    const squares = Math.round((oz + 0.5 - (iz - 0.5)) / 0.25)
    for (let r = 0; r < squares; r++) {
      for (let c = 0; c < 2; c++) {
        const sq = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.25).rotateX(-Math.PI / 2), (r + c) % 2 ? white : black)
        sq.position.set(-0.125 + c * 0.25, 0.035, iz - 0.5 + 0.125 + r * 0.25)
        track.add(sq)
      }
    }
    laneCount = n
  }

  // The main session: race control, a spinning crystal in the infield.
  const coreMat = std(COLOR.main, { emissive: COLOR.main, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.3, flatShading: true })
  const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.62), coreMat)
  const shell = new THREE.Mesh(new THREE.OctahedronGeometry(0.95),
    new THREE.MeshBasicMaterial({ color: COLOR.main, wireframe: true, transparent: true, opacity: 0.55 }))
  core.position.y = shell.position.y = 1.4
  group.add(core, shell)
  const hubTag = label('', 'hub')
  hubTag.position.y = 2.75
  group.add(hubTag)

  const parked = new THREE.Group()
  group.add(parked)
  const finTag = label('', 'board')
  group.add(finTag)
  const typeTag = label('', 'board')
  group.add(typeTag)
  const nameTag = label('', 'sname')
  group.add(nameTag)

  const pods = new Map()
  let working = false
  let lastParked = ''
  return {
    group,
    update(s, now) {
      working = s.main.isWorking
      coreMat.color.setHex(working ? COLOR.main : COLOR.mainOff)
      coreMat.emissive.setHex(working ? COLOR.main : 0x000000)
      shell.material.color.setHex(working ? COLOR.main : COLOR.mainOff)
      hubTag.element.className = `lbl hub${working ? '' : ' off'}`
      hubTag.element.innerHTML = hubText(s)

      const live = liveOf(s)
      if (live.length !== laneCount) buildTrack(live.length)
      // Pods keep their lane object; the lane number follows their place in the list.
      for (const [id, pod] of pods) {
        if (!live.some(a => a.id === id)) { group.remove(pod.trail); pod.trail.geometry.dispose() }
      }
      sync(pods, live, () => {
        const pod = makePod({ k: 0 })
        group.add(pod.trail)
        return pod
      }, group)
      live.forEach((a, i) => {
        const pod = pods.get(a.id)
        pod.lane.k = i
        pod.tagHeight(1.45 + (i % 3) * 1.3)
        pod.update(a, now)
      })

      const [ox, oz] = laneR(Math.max(0, live.length - 1))
      const fin = doneOf(s)
      const key = fin.map(a => `${a.id}:${a.status}`).join('|')
      if (key !== lastParked) {
        lastParked = key
        disposeTree(parked)
        parked.clear()
        fin.slice(0, 8).forEach((a, i) => {
          const colour = COLOR[a.status] ?? COLOR.stopped
          const pod = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.4, 4, 10).rotateX(Math.PI / 2),
            std(colour, { emissive: colour, emissiveIntensity: 0.5 }))
          pod.position.set(-ox * 0.62 - 0.9 + i * 0.45, 0.2, oz + 1.25)
          pod.rotation.y = Math.PI / 2
          parked.add(pod)
        })
      }
      finTag.position.set(-ox * 0.62, -0.2, oz + 2.3)
      finTag.element.innerHTML = finishedSummary(fin) || '<b>FINISHED</b> none yet'
      typeTag.position.set(ox * 0.62, -0.2, oz + 2.3)
      typeTag.element.innerHTML = typesHtml(s.types)
      nameTag.position.set(0, 0.1, oz + 1.5)
      nameTag.element.textContent = s.name
    },
    tick(dt, t) {
      if (!calm) {
        core.rotation.y += dt * (working ? 1.4 : 0.2)
        shell.rotation.y -= dt * (working ? 0.6 : 0.1)
        shell.rotation.x += dt * 0.2
      }
      core.position.y = shell.position.y = 1.4 + (calm ? 0 : 0.12 * Math.sin(t * 1.6))
      for (const pod of pods.values()) pod.tick(dt, t)
    },
  }
}

const CIRCUIT = {
  id: 'circuit', spacing: 22, view: [0, 3.1, 15], dist: 18, targetY: 1.2, sway: 0.55, bloom: [0.9, 0.6, 0.3], exposure: 0.95,
  world(root) {
    scene.background = new THREE.Color(0x0b0221)
    scene.fog = new THREE.Fog(0x1e0638, 45, 260)
    root.add(skyDome([[-0.2, 0x1e0638], [0.0, 0xa3164f], [0.1, 0x4a1272], [0.4, 0x0b0221], [1.0, 0x05010f]]))
    root.add(new THREE.HemisphereLight(0xff6ad5, 0x1a0533, 1.0))

    const sunMat = new THREE.ShaderMaterial({

      fog: false,
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: `uniform float uTime; varying vec2 vUv;
        void main(){
          vec3 top = vec3(1.0, 0.86, 0.3); vec3 bottom = vec3(1.0, 0.16, 0.55);
          vec3 col = mix(bottom, top, smoothstep(0.0, 1.0, vUv.y));
          if (vUv.y < 0.55) {
            float band = fract(vUv.y * 14.0 + uTime * 0.25);

        }`,
    })

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshBasicMaterial({ color: 0x090114 }))
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -0.03
    root.add(ground)
    const grid = new THREE.GridHelper(1200, 240, 0xff2bd6, 0x9b30ff)
    grid.material.transparent = true
    grid.material.opacity = 0.5
    root.add(grid)

    // Wireframe mountains on the horizon all round.
    const rnd = seeded('mountains')
    for (let side = 0; side < 4; side++) {
      const g = new THREE.PlaneGeometry(700, 90, 90, 9)
      const pos = g.attributes.position
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i)
        const row = (pos.getY(i) + 45) / 90
        const h = row <= 0.001 ? 0 : (Math.sin(x * 0.03 + side) * 7 + Math.sin(x * 0.11 + side * 2) * 4 + rnd() * 6 + 9) * Math.sin(row * Math.PI)
        pos.setZ(i, h)
      }
      g.rotateX(-Math.PI / 2)
      const solid = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x0d0220, fog: false }))
      const wire = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xff2bd6, wireframe: true, transparent: true, opacity: 0.45, fog: false }))
      const ridge = new THREE.Group()
      ridge.add(solid, wire)
      ridge.position.z = -300
      const holder = new THREE.Group()
      holder.add(ridge)
      holder.rotation.y = (side * Math.PI) / 2
      root.add(holder)
    }
    return {
      tick(dt, t) {
        sunMat.uniforms.uTime.value = calm ? 0 : t
        if (!calm) grid.position.z = (t * 3) % 5
      },
    }
  },
  unit: circuitUnit,
}

// ============================================================================
// Theme 3: WORKSHOP. A floating island per session. Every working agent is a
// robot hammering at its bench, a ring over its head filling as it goes; the
// agent types that could start sit waiting on a bench; finished work is
// stacked in crates. The main session is the foreman in the middle.
// ============================================================================
function robot({ visor, scale = 1, hat = false, sitting = false }) {
  const group = new THREE.Group()
  const shell = std(0xdde1ea, { roughness: 0.45, metalness: 0.25, flatShading: true })
  const dark = std(0x3b404d, { roughness: 0.6 })
  const visorMat = std(visor, { emissive: visor, emissiveIntensity: 1.3 })
  const parts = []
  const add = (parent, mesh) => { mesh.castShadow = true; parent.add(mesh); parts.push(mesh); return mesh }

  const hips = new THREE.Group()
  hips.position.y = 0.4
  group.add(hips)
  const legs = [-0.12, 0.12].map(x => {
    const hip = new THREE.Group()
    hip.position.x = x
    hips.add(hip)
    add(hip, cube(0.16, 0.4, 0.18, dark, -0.2))
    if (sitting) hip.rotation.x = -Math.PI / 2
    return hip
  })
  add(hips, cube(0.56, 0.54, 0.4, shell, 0.27))
  const chest = add(hips, cube(0.16, 0.09, 0.02, visorMat, 0.36))
  chest.position.z = 0.21

  const head = new THREE.Group()
  head.position.y = 0.56
  hips.add(head)
  add(head, cube(0.46, 0.36, 0.38, shell, 0.18))
  const eyes = add(head, cube(0.36, 0.1, 0.02, visorMat, 0.2))
  eyes.position.z = 0.2
  add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.22, 6), dark)).position.y = 0.47
  const bulb = add(head, new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8), visorMat))
  bulb.position.y = 0.6
  if (hat) {
    const hatMat = std(0xffc83d, { roughness: 0.5 })
    add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.27, 0.14, 16), hatMat)).position.y = 0.43
    add(head, new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.03, 20), hatMat)).position.y = 0.37
  }

  const arms = [-1, 1].map(side => {
    const shoulder = new THREE.Group()
    shoulder.position.set(side * 0.35, 0.48, 0)
    hips.add(shoulder)
    add(shoulder, cube(0.12, 0.4, 0.14, shell, -0.2))
    add(shoulder, cube(0.14, 0.1, 0.16, dark, -0.44))
    return shoulder
  })
  group.scale.setScalar(scale)
  return { group, head, arms, legs, visorMat, parts }
}

function makeStation() {
  const group = new THREE.Group()
  group.scale.setScalar(0.01)
  const bot = robot({ visor: COLOR.running })
  group.add(bot.group)
  // A hammer in the right hand.
  const hammer = new THREE.Group()
  hammer.position.set(0, -0.46, 0.08)
  bot.arms[1].add(hammer)
  hammer.add(cube(0.03, 0.03, 0.34, std(0x8b5a2b), 0))
  const hammerHead = cube(0.1, 0.1, 0.16, std(0x555b66, { metalness: 0.7, roughness: 0.3 }), 0)
  hammerHead.position.z = 0.18
  hammer.add(hammerHead)

  const bench = new THREE.Group()
  bench.position.z = 0.78
  group.add(bench)
  const wood = std(0x8b5a2b, { roughness: 0.85, flatShading: true })
  const top = cube(1.05, 0.12, 0.6, wood, 0.56)
  top.castShadow = top.receiveShadow = true
  bench.add(top)
  for (const [x, z] of [[-0.45, -0.22], [0.45, -0.22], [-0.45, 0.22], [0.45, 0.22]]) {
    const leg = cube(0.08, 0.5, 0.08, wood, 0.25)
    leg.position.set(x, 0.25, z)
    bench.add(leg)
  }
  const anvil = cube(0.32, 0.16, 0.22, std(0x30343d, { metalness: 0.6, roughness: 0.35 }), 0.7)
  anvil.castShadow = true
  bench.add(anvil)

  const sparkMat = glow(0xffb347)
  const sparks = Array.from({ length: 7 }, (_, i) => {
    const sp = cube(0.04, 0.04, 0.04, sparkMat, 0)
    sp.userData.dir = new THREE.Vector3(Math.cos(i * 0.9) * 0.9, 1.2 + (i % 3) * 0.3, Math.sin(i * 1.7) * 0.6)
    bench.add(sp)
    return sp
  })

  // A holographic ring over the robot's head, facing the camera, filling with progress.
  const holo = new THREE.Group()
  holo.position.y = 1.85
  group.add(holo)
  holo.add(new THREE.Mesh(new THREE.RingGeometry(0.26, 0.31, 48), glow(0x2b3a55, { transparent: true, opacity: 0.7, side: THREE.DoubleSide })))
  const arcMat = glow(COLOR.running, { side: THREE.DoubleSide })
  const arc = new THREE.Mesh(new THREE.RingGeometry(0.26, 0.31, 48, 1, Math.PI / 2, -0.001), arcMat)
  holo.add(arc)

  const tag = label('', 'agent')
  tag.position.y = 2.65
  group.add(tag)

  let known = false
  let working = true
  let lastPart = -1
  const phase = Math.random() * 6
  return {
    group,
    update(a, now) {
      const colour = tint(a)
      bot.visorMat.color.setHex(colour)
      bot.visorMat.emissive.setHex(colour)
      arcMat.color.setHex(colour)
      working = a.status !== 'idle'
      const f = fraction(a)
      known = f !== null
      const part = known ? Math.round(f * 100) / 100 : 0.25
      if (part !== lastPart) {
        arc.geometry.dispose()
        arc.geometry = new THREE.RingGeometry(0.26, 0.31, 48, 1, Math.PI / 2, -Math.max(0.001, part) * Math.PI * 2)
        lastPart = part
      }
      setAgentLabel(tag, a, now, { meta: false })
    },
    tick(dt, t) {
      group.scale.setScalar(easeTo(group.scale.x, 1, dt, 5))
      holo.quaternion.copy(camera.quaternion)
      if (!known && !calm) arc.rotation.z -= dt * 2
      else arc.rotation.z = 0
      const swing = working && !calm ? Math.sin(t * 8 + phase) : -1
      bot.arms[1].rotation.x = -1.1 + swing * 0.55
      bot.arms[0].rotation.x = working ? -0.7 : 0
      bot.head.rotation.y = working ? 0 : Math.sin(t * 0.8 + phase) * 0.5
      bot.head.rotation.x = working ? 0.25 : 0
      // Sparks fly from the anvil each time the hammer lands.
      const age = working && !calm ? ((t * 8 + phase) / (Math.PI * 2) + 0.25) % 1 : 1
      for (const sp of sparks) {
        sp.visible = age < 0.6
        sp.position.set(sp.userData.dir.x * age * 0.5, 0.82 + sp.userData.dir.y * age * 0.6 - age * age * 0.8, -0.05 + sp.userData.dir.z * age * 0.4)
      }
    },
  }
}

function workshopUnit(id) {
  const rnd = seeded(id)
  const group = new THREE.Group()
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 7.4, 0.4, 11), std(0x67b957, { flatShading: true, roughness: 0.95 }))
  grass.position.y = -0.2
  grass.receiveShadow = true
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(7.3, 3.6, 3.0, 11), std(0x8a5a3b, { flatShading: true, roughness: 1 }))
  dirt.position.y = -1.9
  const tip = new THREE.Mesh(new THREE.ConeGeometry(3.2, 2.6, 9), std(0x6f4630, { flatShading: true, roughness: 1 }))
  tip.rotation.x = Math.PI
  tip.position.y = -4.6
  group.add(grass, dirt, tip)

  // Trees and rocks round the edge, the same for a session each time.
  const leaves = std(0x3f8f4a, { flatShading: true, roughness: 0.9 })
  const bark = std(0x6b4423, { roughness: 1 })
  const stone = std(0x9aa1ad, { flatShading: true, roughness: 0.9 })
  for (let i = 0; i < 7; i++) {
    const a = rnd() * Math.PI * 2
    if (Math.sin(a) > 0.55) continue // keep the front clear
    const r = 5.9 + rnd() * 1.0
    const tree = new THREE.Group()
    tree.position.set(Math.cos(a) * r, 0, Math.sin(a) * r)
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.7, 6), bark)
    trunk.position.y = 0.35
    const crown = new THREE.Mesh(new THREE.ConeGeometry(0.55 + rnd() * 0.25, 1.4 + rnd() * 0.6, 7), leaves)
    crown.position.y = 1.4
    trunk.castShadow = crown.castShadow = true
    tree.add(trunk, crown)
    group.add(tree)
  }
  for (let i = 0; i < 5; i++) {
    const a = rnd() * Math.PI * 2
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.2 + rnd() * 0.25, 0), stone)
    rock.position.set(Math.cos(a) * (5 + rnd() * 2), 0.1, Math.sin(a) * (5 + rnd() * 2))
    rock.castShadow = true
    group.add(rock)
  }

  // The foreman: the main session.
  const boss = robot({ visor: COLOR.main, scale: 1.45, hat: true })
  group.add(boss.group)
  const clipboard = cube(0.24, 0.3, 0.03, std(0xc8a46a), 0)
  clipboard.position.set(0, -0.45, 0.12)
  boss.arms[0].add(clipboard)
  const hubTag = label('', 'hub')
  hubTag.position.y = 2.7
  group.add(hubTag)

  // The waiting bench: one robot per agent type that could be started.
  const waiting = new THREE.Group()
  waiting.position.set(-3.5, 0, -3.5)
  waiting.rotation.y = Math.PI / 4
  group.add(waiting)
  const benchWood = std(0x8b5a2b, { roughness: 0.85, flatShading: true })
  const seat = cube(4.6, 0.1, 0.6, benchWood, 0.4)
  seat.castShadow = seat.receiveShadow = true
  waiting.add(seat)
  for (const x of [-2.1, 2.1]) {
    const leg = cube(0.12, 0.4, 0.5, benchWood, 0.2)
    leg.position.x = x
    waiting.add(leg)
  }
  const sitters = new THREE.Group()
  waiting.add(sitters)
  const typeTag = label('', 'board')
  typeTag.position.y = 3.4
  waiting.add(typeTag)
  let lastTypes = ''
  let sitBots = []

  const crates = new THREE.Group()
  crates.position.set(4.6, 0, -1.6)
  group.add(crates)
  const finTag = label('', 'board')
  finTag.position.set(4.6, 2.3, -1.6)
  group.add(finTag)
  let lastCrates = ''

  const nameTag = label('', 'sname')
  nameTag.position.set(0, 0.3, 8.0)
  group.add(nameTag)

  const stations = new Map()
  let working = false
  return {
    group,
    update(s, now) {
      working = s.main.isWorking
      boss.visorMat.color.setHex(working ? COLOR.main : COLOR.mainOff)
      boss.visorMat.emissive.setHex(working ? COLOR.main : 0x000000)
      hubTag.element.className = `lbl hub${working ? '' : ' off'}`
      hubTag.element.innerHTML = hubText(s)
      nameTag.element.textContent = s.name

      const live = liveOf(s)
      sync(stations, live, () => makeStation(), group)
      // Benches on an arc across the front half, facing out towards the viewer.
      const spread = live.length > 1 ? Math.min(1.35, 0.55 * (live.length - 1)) : 0
      live.forEach((a, i) => {
        const st = stations.get(a.id)
        const angle = Math.PI / 2 + (live.length > 1 ? spread * ((i / (live.length - 1)) * 2 - 1) : 0)
        st.goal = [Math.cos(angle) * 3.7, Math.sin(angle) * 3.7]
        st.update(a, now)
      })

      const typesKey = s.types.join('|')
      if (typesKey !== lastTypes) {
        lastTypes = typesKey
        disposeTree(sitters)
        sitters.clear()
        sitBots = s.types.slice(0, 5).map((name, i, all) => {
          const bot = robot({ visor: COLOR.type, scale: 0.85, sitting: true })
          bot.group.position.set((i - (all.length - 1) / 2) * 0.85, 0.08, -0.05)
          bot.visorMat.emissiveIntensity = 0.5
          sitters.add(bot.group)
          return bot
        })
      }
      typeTag.element.innerHTML = typesHtml(s.types)

      const fin = doneOf(s)
      const key = fin.map(a => `${a.id}:${a.status}`).join('|')
      if (key !== lastCrates) {
        lastCrates = key
        disposeTree(crates)
        crates.clear()
        const wood = std(0xb07a45, { roughness: 0.9, flatShading: true })
        fin.slice(0, 9).forEach((a, i) => {
          const box = new THREE.Group()
          const row = Math.floor(i / 3)
          box.position.set((i % 3) * 0.62 - 0.62 + row * 0.31, row * 0.56, -row * 0.1)
          const body = cube(0.56, 0.56, 0.56, wood, 0.28)
          body.castShadow = body.receiveShadow = true
          const colour = COLOR[a.status] ?? COLOR.stopped
          const band = cube(0.58, 0.12, 0.58, std(colour, { emissive: colour, emissiveIntensity: 0.35 }), 0.28)
          box.add(body, band)
          crates.add(box)
        })
      }
      finTag.element.innerHTML = finishedSummary(fin) || '<b>FINISHED</b> none yet'
    },
    tick(dt, t) {
      boss.arms[0].rotation.x = working && !calm ? -1.1 + Math.sin(t * 2.6) * 0.25 : -0.9
      boss.arms[1].rotation.x = working && !calm ? Math.sin(t * 3.1) * 0.4 : 0
      boss.head.rotation.y = calm ? 0 : Math.sin(t * 0.6) * 0.6
      sitBots.forEach((bot, i) => {
        bot.head.rotation.y = calm ? 0 : Math.sin(t * 0.7 + i * 1.3) * 0.5
        bot.visorMat.emissiveIntensity = (t + i * 1.7) % 5 < 0.12 ? 0 : 0.5
      })
      for (const st of stations.values()) {
        if (st.goal) {
          st.group.position.x = easeTo(st.group.position.x, st.goal[0], dt, 3)
          st.group.position.z = easeTo(st.group.position.z, st.goal[1], dt, 3)
          st.group.rotation.y = Math.atan2(st.group.position.x, st.group.position.z)
        }
        st.tick(dt, t)
      }
    },
  }
}

const WORKSHOP = {

  world(root) {

    scene.fog = new THREE.Fog(0xe6a873, 70, 260)

    const sea = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), std(0x4aa3d6, { roughness: 0.3, metalness: 0.05, emissive: 0x0c3550, emissiveIntensity: 0.6 }))
    sea.rotation.x = -Math.PI / 2
    sea.position.y = -3.5
    root.add(sea)
    root.add(new THREE.HemisphereLight(0xcfe2ff, 0x6b4a2e, 1.0))
    const sun = new THREE.DirectionalLight(0xffe2b8, 2.2)
    sun.position.set(18, 26, 14)
    sun.castShadow = true
    sun.shadow.mapSize.set(2048, 2048)
    Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 120 })
    sun.shadow.bias = -0.0004
    sun.shadow.normalBias = 0.02
    root.add(sun)
    // Low-poly clouds drifting past.
    const puff = std(0xffffff, { flatShading: true, roughness: 1 })
    const rnd = seeded('clouds')
    const clouds = Array.from({ length: 9 }, () => {
      const c = new THREE.Group()
      for (let j = 0; j < 4; j++) {
        const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1 + rnd() * 1.4, 0), puff)
        m.position.set(j * 1.4 - 2, rnd() * 0.6, rnd() * 1.2)

    })

      tick(dt) {

        for (const c of clouds) {
          c.position.x += dt * c.userData.speed

        }
      },

  unit: workshopUnit,

// ============================================================================
// Theme 4: STAGE. The first look: glass towers filling on a round stage.
// ============================================================================
function makeTower() {
  const group = new THREE.Group()
  const TOWER = 3.1
  const base = cube(1.3, 0.14, 1.3, std(0x1b2747, { roughness: 0.6, metalness: 0.3 }), 0.07)
  group.add(base)
  const fillMat = std(COLOR.running, { emissive: COLOR.running, emissiveIntensity: 0.9, roughness: 0.35, transparent: true, opacity: 0.95 })
  const fill = new THREE.Mesh(GEO.boxUp, fillMat)
  fill.scale.set(0.82, 0.01, 0.82)
  fill.position.y = 0.14
  group.add(fill)
  const glass = new THREE.Mesh(GEO.boxUp, std(0x9fdcff, { transparent: true, opacity: 0.08, roughness: 0.1, depthWrite: false }))
  glass.scale.set(1.04, TOWER, 1.04)
  glass.position.y = 0.14
  const edges = new THREE.LineSegments(GEO.edgesUp, new THREE.LineBasicMaterial({ color: 0xbfe9ff, transparent: true, opacity: 0.55 }))
  edges.scale.copy(glass.scale)
  edges.position.y = 0.14
  group.add(glass, edges)
  const arcMat = glow(COLOR.running, { transparent: true, opacity: 0.85, side: THREE.DoubleSide })
  const arc = new THREE.Mesh(new THREE.RingGeometry(0.98, 1.1, 48, 1, 0, Math.PI * 1.5).rotateX(-Math.PI / 2), arcMat)
  arc.position.y = 0.02
  group.add(arc)
  const tag = label('', 'agent')
  tag.position.y = TOWER + 1.6
  group.add(tag)
  let height = 0.01
  let target = 0.01
  let known = true
  const phase = Math.random() * 6
  group.scale.setScalar(0.01)
  return {
    group,
    update(a, now) {
      const colour = tint(a)
      fillMat.color.setHex(colour)
      fillMat.emissive.setHex(colour)
      arcMat.color.setHex(colour)
      const f = fraction(a)
      known = f !== null
      target = known ? Math.max(0.06, f) * TOWER * 0.94 : TOWER * 0.94
      setAgentLabel(tag, a, now)
    },
    tick(dt, t) {
      group.scale.setScalar(easeTo(group.scale.x, 1, dt, 5))
      height = easeTo(height, target, dt, 2.5)
      fill.scale.y = height
      const pulse = calm ? 0.6 : 0.5 + 0.5 * Math.sin(t * 3.2 + phase)
      fillMat.opacity = known ? 0.95 : 0.35 + 0.45 * pulse
      fillMat.emissiveIntensity = known ? 0.9 : 0.4 + 0.9 * pulse
      if (!calm) arc.rotation.y -= dt * 1.6
    },
  }
}

function stageUnit() {
  const group = new THREE.Group()
  const STAGE = 7.4
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(STAGE, STAGE + 0.15, 0.5, 96), std(0x0c1530, { roughness: 0.75, metalness: 0.35 }))
  disc.position.y = -0.25
  group.add(disc)
  const rim = new THREE.Mesh(new THREE.TorusGeometry(STAGE + 0.02, 0.05, 8, 200).rotateX(Math.PI / 2), glow(COLOR.rim))
  rim.position.y = 0.01
  group.add(rim)
  for (const r of [2.4, 4.8]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.02, r + 0.02, 128).rotateX(-Math.PI / 2), glow(COLOR.rim, { transparent: true, opacity: 0.25 }))
    ring.position.y = 0.012
    group.add(ring)
  }
  const hubMat = std(COLOR.mainOff, { emissive: COLOR.main, emissiveIntensity: 0, roughness: 0.4 })
  group.add(cube(1.6, 0.55, 1.6, hubMat), cube(1.0, 0.5, 1.0, hubMat, 0.8))
  const hubTag = label('', 'hub')
  hubTag.position.y = 1.75
  group.add(hubTag)
  const nameTag = label('', 'sname')
  nameTag.position.set(0, 0.2, STAGE + 1.1)
  group.add(nameTag)

  const towers = new Map()
  const blocks = new Map()
  const pedestals = new Map()
  let working = false
  const small = (colour, w, h, html, cls) => {
    const g = new THREE.Group()
    g.add(cube(w, h, w, std(colour, { emissive: colour, emissiveIntensity: 0.18, transparent: true, opacity: 0.9 })))
    const tag = label(html, cls)
    tag.position.y = h + 0.45
    g.add(tag)
    return { group: g, tick() {} }
  }
  return {
    group,
    update(s, now) {
      working = s.main.isWorking
      hubMat.color.setHex(working ? COLOR.main : COLOR.mainOff)
      hubTag.element.className = `lbl hub${working ? '' : ' off'}`
      hubTag.element.innerHTML = hubText(s)
      nameTag.element.textContent = s.name
      const live = liveOf(s)
      sync(towers, live, () => makeTower(), group)
      const tp = ringPositions(live.length, 3.05, -Math.PI / 2)
      live.forEach((a, i) => { const tw = towers.get(a.id); tw.update(a, now); tw.goal = tp[i] })
      const fin = doneOf(s)
      sync(blocks, fin, a => small(COLOR[a.status] ?? COLOR.stopped, 0.8, 0.6,
        `${a.status === 'done' ? '✓' : a.status === 'failed' ? '✕' : '■'} ${esc(a.description)}`, `small fin ${a.status}`), group)
      const bp = ringPositions(fin.length, 5.3, Math.PI / 2 + 0.35)
      fin.forEach((a, i) => { blocks.get(a.id).goal = bp[i] })
      const types = s.types.slice(0, 14).map(name => ({ id: name }))
      sync(pedestals, types, t => small(COLOR.type, 0.62, 0.32, esc(t.id), 'small'), group)
      const pp = ringPositions(types.length, 6.6, -Math.PI / 2 + Math.PI / Math.max(1, types.length))
      types.forEach((t, i) => { pedestals.get(t.id).goal = pp[i] })
    },
    tick(dt, t) {
      hubMat.emissiveIntensity = working ? (calm ? 0.6 : 0.45 + 0.35 * Math.sin(t * 2.4)) : 0
      for (const map of [towers, blocks, pedestals]) {
        for (const item of map.values()) {
          if (item.goal) {
            item.group.position.x = easeTo(item.group.position.x, item.goal[0], dt, 3)
            item.group.position.z = easeTo(item.group.position.z, item.goal[1], dt, 3)
          }
          item.tick(dt, t)
        }
      }
    },
  }
}

const STAGE = {
  id: 'stage', spacing: 17.5, view: [17, 14, 20], dist: 28, targetY: 0, sway: 0, bloom: [0.7, 0.5, 0.22], exposure: 1.05,
  world(root) {
    scene.background = new THREE.Color(0x05070f)
    scene.fog = new THREE.FogExp2(0x05070f, 0.012)
    root.add(new THREE.HemisphereLight(0x9bb8ff, 0x0a0c18, 0.7))
    const sun = new THREE.DirectionalLight(0xffffff, 1.3)
    sun.position.set(-10, 18, 8)
    root.add(sun)
    const grid = new THREE.GridHelper(600, 300, 0x1a2550, 0x0d1430)
    grid.material.transparent = true
    grid.material.opacity = 0.35
    grid.position.y = -0.52
    root.add(grid)
    return {}
  },
  unit: stageUnit,
}

// ============================================================================
// The deck: one unit per session, laid round a circle, in the chosen theme.
// ============================================================================
const THEMES = { decks: DECKS, circuit: CIRCUIT, workshop: WORKSHOP, stage: STAGE }
let theme = null
let root = null
let world = {}
const units = new Map()
let sessionsNow = []
let span = 0

function layout(count, spacing) {
  if (count <= 1) return [[0, 0]]
  const r = spacing / (2 * Math.sin(Math.PI / count))
  return Array.from({ length: count }, (_, i) => {
    const a = Math.PI / 2 + (i / count) * Math.PI * 2
    return [Math.cos(a) * r, Math.sin(a) * r]
  })
}

function setTheme(id) {
  for (const unit of units.values()) disposeTree(unit.group)
  units.clear()
  if (root) {
    disposeTree(root)
    scene.remove(root)
  }
  theme = THEMES[id] ?? DECKS
  root = new THREE.Group()
  scene.add(root)
  world = theme.world(root) ?? {}
  ;[bloom.strength, bloom.radius, bloom.threshold] = theme.bloom
  renderer.toneMappingExposure = theme.exposure
  document.body.dataset.look = theme.id
  controls.target.set(0, theme.targetY, 0)
  camera.position.set(...theme.view).normalize().multiplyScalar(theme.dist).add(controls.target)
  controls.autoRotate = rotateWanted && !theme.sway
  zoomed = false
  update(sessionsNow)
}

function update(sessions) {
  sessionsNow = sessions
  if (!theme) return
  const now = Date.now()
  const ids = new Set(sessions.map(s => s.id))
  for (const [id, unit] of units) {
    if (!ids.has(id)) {
      disposeTree(unit.group)
      root.remove(unit.group)
      units.delete(id)
    }
  }
  const spots = layout(sessions.length, theme.spacing)
  sessions.forEach((s, i) => {
    let unit = units.get(s.id)
    if (!unit) {
      unit = theme.unit(s.id)
      unit.group.position.set(spots[i][0], 0, spots[i][1])
      root.add(unit.group)
      units.set(s.id, unit)
    }
    unit.spot = spots[i]
    unit.update(s, now)
  })
  span = sessions.length <= 1 ? 0 : theme.spacing / (2 * Math.sin(Math.PI / sessions.length))
}

function resize() {
  const w = innerWidth
  const h = innerHeight
  renderer.setSize(w, h)
  composer.setSize(w, h)
  bloom.setSize(w, h)
  labels.setSize(w, h)
  camera.aspect = w / h
  // Keep the scene centred in the room the list leaves.
  const panel = document.body.classList.contains('nopanel') ? 0 : document.getElementById('panel').offsetWidth + 16
  if (panel) camera.setViewOffset(w, h, panel / 2, 0, w, h)
  else camera.clearViewOffset()
  camera.updateProjectionMatrix()
}
addEventListener('resize', resize)
resize()

const clock = new THREE.Clock()
const offset = new THREE.Vector3()
const sph = new THREE.Spherical()
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1)
  const t = clock.elapsedTime
  // Pull the camera out as sessions are added, so every one stays in view.
  const roomy = document.body.classList.contains('nopanel') ? 1 : 1.22
  const want = (theme.dist + span * 1.6) * roomy
  offset.copy(camera.position).sub(controls.target)
  sph.setFromVector3(offset)
  if (!zoomed) sph.radius = easeTo(sph.radius, want, dt, 1.5)
  // Themes with a front sway back and forth across it rather than circling.
  if (theme.sway && rotateWanted && !interacting && !calm) sph.theta = easeTo(sph.theta, Math.sin(t * 0.13) * theme.sway, dt, 1.2)
  offset.setFromSpherical(sph)
  camera.position.copy(controls.target).add(offset)

  world.tick?.(dt, t)
  for (const unit of units.values()) {
    if (unit.spot) {
      unit.group.position.x = easeTo(unit.group.position.x, unit.spot[0], dt, 3)
      unit.group.position.z = easeTo(unit.group.position.z, unit.spot[1], dt, 3)
    }
    unit.tick(dt, t)
  }
  controls.update()
  composer.render()
  labels.render(scene, camera)
  requestAnimationFrame(frame)
}

window.__deckScene = {
  update,
  resize,
  setTheme,
  toggleRotate() {
    rotateWanted = !rotateWanted
    controls.autoRotate = rotateWanted && !theme.sway
  },
}
setTheme(window.__deckThemeId)
update(window.__deckSessions())
requestAnimationFrame(frame)
</script>
