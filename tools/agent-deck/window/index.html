<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument panel. Header bar, the live stage (Orbit, Board or Lanes) on the left, a detail rail on the right. */
:root {
  --bg: #0c0f13;
  --panel: #12161c;
  --raise: #191e26;
  --line: #242b35;
  --fg: #e7ecf2;
  --dim: #8d99a7;
  --faint: #5b6674;
  --accent: #8fb3ff;
  --work: #3dd6c3;
  --wait: #f4b54a;
  --done: #7ccf8c;
  --fail: #f07262;
  --idle: #6f7d8e;
  --display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  --body: "Figtree", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #edf0f4; --panel: #ffffff; --raise: #f4f6f9; --line: #d8dee6; --fg: #121820; --dim: #556170; --faint: #8994a2;
    --accent: #2d5bd7; --work: #0a9886; --wait: #b4760a; --done: #2d8a45; --fail: #c7422e; --idle: #7b8898;
    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; padding-inline: 16px; padding-block: 14px; }

/* Header */
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.05rem; letter-spacing: .2em; text-transform: uppercase; }
.brand p { margin: 2px 0 0; color: var(--dim); font-size: .84rem; font-variant-numeric: tabular-nums; }
.brand .warn { color: var(--wait); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button, .btn { border: 0; background: transparent; color: var(--dim); padding: 7px 12px; font-size: .8rem; font-weight: 500; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover, .btn:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.btn { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.k { font-family: var(--mono); font-size: .68rem; color: var(--faint); }

/* Notice */
.notice { grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: .86rem; }
.notice p { margin: 0; flex: 1 1 260px; min-width: 0; }

/* Stage + rail */
.main { grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; min-height: 0; }
body.norail .main { grid-template-columns: minmax(0, 1fr); }
body.norail .rail { display: none; }
.stage { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background: radial-gradient(ellipse at 50% 55%, color-mix(in srgb, var(--accent) 7%, var(--panel)) 0%, var(--panel) 62%); }
#orbit { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pane { position: absolute; inset: 0; overflow: auto; padding: 16px; }
.rail { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 18px; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 64vh; min-height: 420px; }
}

/* Shared bits */
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.shape { width: 10px; height: 10px; background: currentColor; display: inline-block; flex: none; }
.shape.cloud { border-radius: 50%; }
.shape.local { border-radius: 2px; }
.shape.hollow { background: transparent; box-shadow: inset 0 0 0 2px currentColor; }
.t-work { color: var(--work); } .t-wait { color: var(--wait); } .t-fail { color: var(--fail); } .t-done { color: var(--done); } .t-idle { color: var(--idle); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.tag { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: .74rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.eyebrow { margin: 0; font-family: var(--display); font-size: .74rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.empty { color: var(--faint); font-size: .86rem; margin: 0; }

/* Board */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start; }
.col { display: grid; gap: 10px; min-width: 0; }
.col-head { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.col-head .mono { margin-left: auto; }
.card { width: 100%; text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 7px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--faint); }
.card.sel { border-color: var(--accent); }
.card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-top .mono { margin-left: auto; }
.card-title { font-weight: 600; font-size: .95rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-line { font-size: .84rem; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-line.needs { color: var(--wait); }
.agents { display: grid; gap: 5px; margin: 0; padding: 8px 0 0; list-style: none; border-top: 1px dashed var(--line); }
.agents li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: .8rem; }
.agents li .dot { transform: translateY(-1px); }
.agents .what { color: var(--dim); }

/* Lanes */
.lanes { display: grid; min-width: 0; }
.lanes-head, .lane { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: center; }
.lanes-head { position: sticky; top: -16px; background: var(--panel); padding: 0 0 8px; z-index: 1; }
.axis { position: relative; height: 16px; }
.axis span { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--mono); font-size: .66rem; color: var(--faint); white-space: nowrap; }
.axis span:last-child { transform: translateX(-100%); }
.axis span:first-child { transform: none; }
.lane { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 0; cursor: pointer; }
.lane:hover .lane-name { text-decoration: underline; text-decoration-color: var(--faint); }
.lane.sel .lane-name { color: var(--accent); }
.lane-label { display: grid; gap: 3px; min-width: 0; }
.lane-name { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.track { position: relative; height: 54px; border-radius: 6px; background-color: var(--raise);
  background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; }
.tick { position: absolute; top: 6px; width: 2px; height: 10px; border-radius: 1px; background: var(--faint); }
.tick.hot { background: var(--work); }
.run { position: absolute; height: 13px; border-radius: 3px; font-family: var(--mono); font-size: .62rem; line-height: 13px; padding: 0 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--fg); }
.run.live { background: color-mix(in srgb, var(--work) 30%, transparent); box-shadow: inset 0 0 0 1px var(--work); }
.run.end { background: color-mix(in srgb, var(--done) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--done) 60%, transparent); color: var(--dim); }
.run.bad { background: color-mix(in srgb, var(--fail) 20%, transparent); box-shadow: inset 0 0 0 1px var(--fail); }
.mark { position: absolute; top: 4px; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg); background: var(--dim); }
.nowcap { position: absolute; right: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 6px 6px 0; background: var(--work); }
.track .when { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: .7rem; color: var(--faint); }
@media (max-width: 640px) {
  .lanes-head, .lane { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .lanes-head .spacer { display: none; }
}

/* Rail */
.rail section { display: grid; gap: 10px; }
.row { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 7px 8px; margin: 0 -8px; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; cursor: pointer; }
.row:hover { background: var(--raise); }
.row .sub { grid-column: 2 / 4; font-size: .8rem; color: var(--wait); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); }
.detail-title { margin: 0; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 7px 12px; font-size: .86rem; }
dt { color: var(--faint); }
dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
dd.needs { color: var(--wait); }
.open { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; text-decoration: none; font-weight: 600; font-size: .86rem; }
.open:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; font-size: .8rem; color: var(--dim); margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 8px; }
.keys { font-size: .78rem; color: var(--faint); margin: 0; }
.keys .k { color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 2px; }

/* 3D layouts: the scene fills the stage; labels float over it (fixed colours: the scene is dark in either scheme). */
#three { position: absolute; inset: 0; background: #05070f; }
#three canvas { display: block; width: 100%; height: 100%; }
#three-labels { position: absolute; inset: 0; pointer-events: none; }
#three-labels .lbl[data-key] { pointer-events: auto; cursor: pointer; }
#three-bar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
  padding: 4px; border-radius: 999px; background: rgba(5, 8, 20, 0.66); border: 1px solid rgba(160, 180, 230, 0.25); color: #e6ecff;
  font-size: .82rem; backdrop-filter: blur(6px); max-width: calc(100% - 24px); }
#three-bar button { border: 0; background: transparent; color: #e6ecff; cursor: pointer; padding: 4px 10px; border-radius: 999px; }
#three-bar button:hover { background: rgba(255, 255, 255, 0.1); }
#three-bar span { padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#three-bar .mono { color: #9aa6c4; }
#three-note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 440px; margin: 0; text-align: center; color: #9aa6c4; }
.lbl { font-family: var(--body); white-space: nowrap; text-align: center; color: #e6ecff; text-shadow: 0 1px 3px #000, 0 0 10px #000; transform: translateY(-50%); }
.lbl.agent .n { font-family: var(--display); font-size: 19px; font-weight: 600; color: #37d7ff; }
.lbl.agent.idle .n { color: #f5b14c; }
.lbl.agent .d { font-size: 15px; font-weight: 600; color: #f0f8ff; max-width: 230px; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
.lbl.agent .a { font-size: 12.5px; color: #cfe6ff; max-width: 230px; overflow: hidden; text-overflow: ellipsis; margin: 0 auto; }
.lbl.agent .m { font-size: 12px; color: #a9b6dc; }
.lbl .pb { width: 140px; height: 4px; margin: 5px auto 0; background: rgba(255, 255, 255, 0.18); border-radius: 2px; overflow: hidden; position: relative; }
.lbl .pb i { position: absolute; inset: 0 auto 0 0; background: #37d7ff; border-radius: 2px; }
.lbl.agent.idle .pb i { background: #f5b14c; }
.lbl .pb.unknown i { width: 30%; animation: slide 1.6s ease-in-out infinite; }
@keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
.lbl.hub { font-size: 14px; color: #d4c2ff; }
.lbl.hub.off { color: #a3a9c6; }
.lbl.hub.need { color: #f6b84e; font-weight: 600; }
.lbl.small { font-size: 12px; color: #c0c8e4; }
.lbl.sname { font-family: var(--display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: #b3c3ff; font-weight: 600; }
.lbl .place { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; color: #9fb0d9; border: 1px solid rgba(160, 180, 230, .4); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.lbl.board { font-size: 12.5px; background: rgba(12, 6, 30, 0.72); border: 1px solid rgba(255, 60, 200, 0.45); border-radius: 8px; padding: 5px 10px; text-shadow: none; white-space: normal; max-width: 300px; }
.lbl.board b { font-family: var(--display); color: #ff7ad9; font-weight: 600; letter-spacing: .08em; }
#three[data-look="workshop"] .lbl.board { background: rgba(30, 22, 14, 0.72); border-color: rgba(255, 200, 120, 0.45); }
#three[data-look="workshop"] .lbl.board b { color: #ffd27a; }
#three[data-look="decks"] .lbl.board { border-color: rgba(120, 200, 255, 0.45); }
#three[data-look="decks"] .lbl.board b { color: #7fdcff; }

@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .lbl .pb.unknown i { animation: none; left: 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Agent Deck</h1>
      <p id="summary">Waiting for data…</p>
    </div>
    <div class="controls">
      <div class="seg" id="views" role="group" aria-label="Layout">
        <button id="view-decks" data-view="decks" aria-pressed="true">Decks <span class="k">1</span></button>
        <button id="view-circuit" data-view="circuit" aria-pressed="false">Circuit <span class="k">2</span></button>
        <button id="view-workshop" data-view="workshop" aria-pressed="false">Workshop <span class="k">3</span></button>
        <button id="view-orbit" data-view="orbit" aria-pressed="false">Orbit <span class="k">4</span></button>
        <button id="view-board" data-view="board" aria-pressed="false">Board <span class="k">5</span></button>
        <button id="view-lanes" data-view="lanes" aria-pressed="false">Lanes <span class="k">6</span></button>
      </div>
      <div class="seg" id="ranges" role="group" aria-label="Time range">
        <button id="range-day" data-range="day" aria-pressed="true">Today</button>
        <button id="range-week" data-range="week" aria-pressed="false">This week</button>
      </div>
      <button class="btn" id="cam" title="Move the camera by itself, or hold it still (R)" hidden>Camera <span class="k">R</span></button>
      <button class="btn" id="list" title="Show or hide the list (L)">List <span class="k">L</span></button>
      <button class="btn" id="full" title="Fill the screen (F)">Fullscreen <span class="k">F</span></button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="main">
    <section class="stage" aria-label="Sessions">
      <div id="three" hidden aria-label="3D view of your sessions"><div id="three-labels"></div><p id="three-note" hidden></p>
        <div id="three-bar" hidden><button id="f-prev" title="Previous session ([)" aria-label="Previous session">◀</button><span id="f-name"></span><button id="f-next" title="Next session (])" aria-label="Next session">▶</button></div></div>
      <canvas id="orbit" aria-label="Orbit view of your sessions"></canvas>
      <div class="pane" id="board" hidden></div>
      <div class="pane" id="lanes" hidden></div>
    </section>
    <aside class="rail" id="rail" aria-live="polite"></aside>
  </div>
</div>

<script>
// The Claude sessions with the deck write deck-data.js next to this page; it is read again every second.
// `sessions` is each open local session's own entry (its agents, live). `cloud` is the account's session list
// from claude.ai, fetched by one of them every 20 seconds: cloud sessions, and local ones connected to claude.ai.
(() => {
  'use strict'

  const VIEWS = ['decks', 'circuit', 'workshop', 'orbit', 'board', 'lanes']
  const THREE_D = ['decks', 'circuit', 'workshop']
  const DEMO = /demo/.test(location.hash)
  const RANGE_MS = { day: 24 * 3600e3, week: 7 * 24 * 3600e3 }
  const LANE_MS = 60 * 60e3
  const LOCAL_STALE_MS = 60e3

  const store = {
    get(k) { try { return localStorage.getItem(k) } catch { return null } },
    set(k, v) { try { localStorage.setItem(k, v) } catch { /* a convenience only */ } },
  }

  const S = {
    data: null,
    receivedAt: 0,
    view: (() => {
      // The 3D looks arrived after Orbit: open on them once, then keep whatever is picked.
      if (!store.get('deck.seen3d')) { store.set('deck.seen3d', '1'); store.set('deck.view', 'decks'); return 'decks' }
      return VIEWS.includes(store.get('deck.view')) ? store.get('deck.view') : 'decks'
    })(),
    range: store.get('deck.range') === 'week' ? 'week' : 'day',
    selected: null,
    localTicks: new Map(),
  }
  if (store.get('deck.norail') === '1') document.body.classList.add('norail')

  // ---------- helpers ----------
  const $ = id => document.getElementById(id)
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag)
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue
      if (k === 'class') el.className = v
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
      else el.setAttribute(k, v === true ? '' : String(v))
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === undefined || kid === null || kid === false) continue
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
    }
    return el
  }
  const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s }
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's')
  function ago(t, now = Date.now()) {
    if (!t) return '—'
    const s = Math.max(0, Math.round((now - t) / 1000))
    if (s < 10) return 'just now'
    if (s < 60) return s + 's ago'
    const m = Math.round(s / 60)
    if (m < 60) return m + 'm ago'
    const hr = Math.round(m / 60)
    if (hr < 48) return hr + 'h ago'
    return Math.round(hr / 24) + 'd ago'
  }
  function span(ms) {
    const m = Math.max(0, Math.round(ms / 60e3))
    if (m < 1) return 'under a minute'
    if (m < 60) return m + 'm'
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
  }

  // ---------- one list from local entries and the cloud list ----------
  const LABEL = { working: 'Working', blocked: 'Waiting for you', failed: 'Stopped with an error', done: 'Finished its turn', stopped: 'Stopped', idle: 'Open, ready for your next message' }
  const TONE = { working: 'work', blocked: 'wait', failed: 'fail', done: 'done', stopped: 'idle', idle: 'idle' }
  const group = st => st === 'working' ? 'work' : (st === 'blocked' || st === 'failed') ? 'wait' : 'recent'
  const isLive = a => a.status === 'running' || a.status === 'idle'
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '')

  function sessions(now = Date.now()) {
    const d = S.data || {}
    const cloud = (d.cloud && Array.isArray(d.cloud.sessions)) ? d.cloud.sessions : []
    const used = new Set()
    const out = []

    for (const e of Object.values(d.sessions || {})) {
      if (!e || now - (e.updatedAt || 0) > LOCAL_STALE_MS) continue
      const agents = e.agents || []
      const working = !!(e.main && e.main.isWorking) || agents.some(a => a.status === 'running')
      // The same session as claude.ai lists it, when it is connected there: same folder or repository.
      const twin = cloud.find(c => !used.has(c.id) && c.place === 'local' && c.repo && norm(c.repo) === norm(e.name) && now - c.updatedAt < RANGE_MS.day)
      if (twin) used.add(twin.id)
      const status = working ? 'working' : twin && (twin.state === 'blocked' || twin.state === 'failed') ? twin.state : 'idle'
      out.push({
        key: 'local:' + e.id,
        title: twin ? twin.title : e.name,
        place: 'local', offline: false, fromPlugin: true,
        status,
        repo: twin ? twin.repo : e.name,
        branch: twin ? twin.branch : undefined,
        updatedAt: e.updatedAt,
        createdAt: twin ? twin.createdAt : 0,
        needs: twin ? twin.needs : undefined,
        detail: twin ? twin.detail : undefined,
        doing: e.main && e.main.action,
        agents,
        types: e.types || [],
        cloudId: twin ? twin.id : undefined,
        activity: S.localTicks.get(e.id) || [],
      })
    }

    for (const c of cloud) {
      if (used.has(c.id)) continue
      out.push({
        key: 'cloud:' + c.id,
        title: c.title,
        place: c.place, offline: !!c.offline, fromPlugin: false,
        status: c.state,
        repo: c.repo, branch: c.branch,
        updatedAt: c.updatedAt, createdAt: c.createdAt,
        needs: c.needs, detail: c.detail, doing: c.doing,
        agents: c.agents || [],
        types: [],
        cloudId: c.id,
        activity: c.activity || [],
      })
    }

    const rank = { work: 0, wait: 1, recent: 2 }
    return out
      .filter(s => s.fromPlugin || s.status === 'working' || now - s.updatedAt <= RANGE_MS[S.range])
      .sort((a, b) => rank[group(a.status)] - rank[group(b.status)] || b.updatedAt - a.updatedAt)
  }

  const agentsOf = s => ({
    running: s.agents.filter(isLive),
    finished: s.agents.filter(a => !isLive(a)).slice(0, 6),
  })

  // A local session's own activity: noted while it works, for the Lanes view.
  function noteLocalActivity(now) {
    for (const e of Object.values((S.data && S.data.sessions) || {})) {
      if (!e || !e.main || !e.main.isWorking) continue
      const ticks = S.localTicks.get(e.id) || []
      if (!ticks.length || now - ticks[ticks.length - 1] > 15e3) ticks.push(now)
      while (ticks.length && now - ticks[0] > LANE_MS) ticks.shift()
      S.localTicks.set(e.id, ticks)
    }
  }

  // ---------- data file ----------
  window.__deckData = d => { S.data = d; S.receivedAt = Date.now() }

  // #demo: made-up sessions and agents, to try the layouts.
  const demoStart = Date.now()
  function demoData() {
    const t = Date.now()
    const agent = (id, n, description, type, action, cycleMs, offsetMs, steps) => {
      const age = (t - demoStart + offsetMs) % cycleMs
      const f = age / cycleMs
      const est = steps ? { text: '~' + span(cycleMs - age) + ' left (' + Math.floor(f * steps) + '/' + steps + ' steps)', fraction: f } : { text: 'no estimate yet' }
      return { id, n, description, type, status: 'running', action, startedAt: t - age, tools: 3 + Math.floor(age / 4000), est }
    }
    const done = (id, description, status) => ({ id, n: 1, description, type: 'general-purpose', status, startedAt: demoStart - 400e3, endedAt: demoStart - 120e3, tools: 20, est: { text: status } })
    return {
      v: 1,
      sessions: {
        s1: { id: 's1', name: 'licence-server', updatedAt: t, types: ['general-purpose', 'Explore', 'Plan', 'claude-code-guide'],
          main: { isWorking: true, action: 'Checking the 15s cut' },
          agents: [
            agent('a1', 1, 'Stem Splitter promo videos', 'general-purpose', 'Rendering the 28s cut', 90e3, 30e3, 7),
            agent('a2', 2, 'DJ Master promo videos', 'general-purpose', 'Filming the requests promo', 120e3, 0, 0),
            agent('a3', 3, 'Find licence checks', 'Explore', 'Searching the code for "activate"', 60e3, 45e3, 4),
            done('d1', 'Fix installer icon', 'done'),
            done('d2', 'Sign the Mac build', 'failed'),
          ] },
      },
      cloud: { fetchedAt: t - 5e3, sessions: [
        { id: 'c1', title: 'Release notes for 1.37', place: 'cloud', offline: false, state: 'working', repo: 'dj-master-releases', updatedAt: t, createdAt: t - 900e3,
          doing: 'Writing the changelog', agents: [{ id: 'c1a', description: 'Collect merged changes', type: 'Explore', status: 'running', action: 'Reading git history', startedAt: t - 200e3, tools: 14 }] },
        { id: 'c2', title: 'Instagram reel cut', place: 'cloud', offline: false, state: 'blocked', repo: 'yoshic-site', updatedAt: t - 600e3, createdAt: t - 3000e3,
          needs: 'Which of the two edits do you want?', agents: [] },
        { id: 'c3', title: 'Trading journal fixes', place: 'cloud', offline: false, state: 'done', repo: 'trading-journal', updatedAt: t - 7200e3, createdAt: t - 9000e3, detail: 'Fixed the CSV import', agents: [] },
      ] },
    }
  }

  function poll() {
    if (DEMO) { window.__deckData(demoData()); return }
    const s = document.createElement('script')
    s.src = 'deck-data.js?t=' + Date.now()
    s.onload = s.onerror = () => s.remove()
    document.head.appendChild(s)
  }

  // ---------- header, notice, rail ----------
  function render() {
    const now = Date.now()
    noteLocalActivity(now)
    for (const v of VIEWS) $('view-' + v).setAttribute('aria-pressed', String(S.view === v))
    $('range-day').setAttribute('aria-pressed', String(S.range === 'day'))
    $('range-week').setAttribute('aria-pressed', String(S.range === 'week'))
    $('board').hidden = S.view !== 'board'
    $('lanes').hidden = S.view !== 'lanes'
    $('orbit').hidden = S.view !== 'orbit'
    const is3d = THREE_D.includes(S.view)
    $('three').hidden = !is3d
    $('cam').hidden = !is3d
    const list = sessions(now)
    if (S.selected && !list.some(s => s.key === S.selected)) S.selected = null
    renderSummary(list, now)
    renderNotice(now)
    if (S.view === 'board') renderBoard(list, now)
    if (S.view === 'lanes') renderLanes(list, now)
    if (S.view === 'orbit') ensureOrbit()
    if (is3d) show3d(list, now)
    else if (window.__deckScene) window.__deckScene.hide()
    renderRail(list, now)
  }

  // ---------- 3D layouts: the sessions that are working or need you, and this computer's ----------
  function scene3d(list) {
    return list.filter(s => s.fromPlugin || group(s.status) !== 'recent').slice(0, 6).map(s => {
      let n = 0
      return {
        id: s.key,
        name: s.title,
        place: s.place,
        main: { isWorking: s.status === 'working', action: s.doing, needs: group(s.status) === 'wait' ? (s.needs || LABEL[s.status]) : '' },
        types: s.types,
        agents: s.agents.map(a => (isLive(a) ? { ...a, n: ++n } : a)),
      }
    })
  }
  // One session at a time, large: the one picked in the list, else each in turn every 20 seconds.
  const CYCLE_MS = 20e3
  let focusIdx = 0
  let focusAt = Date.now()
  function focus3d(all, now) {
    const picked = all.find(s => s.id === S.selected)
    if (picked) return { shown: [picked], auto: false, i: all.indexOf(picked) }
    if (!all.length) return { shown: [], auto: false, i: 0 }
    if (all.length > 1 && now - focusAt > CYCLE_MS) { focusIdx++; focusAt = now }
    const i = ((focusIdx % all.length) + all.length) % all.length
    return { shown: [all[i]], auto: all.length > 1, i }
  }
  function step(by) {
    const all = scene3d(sessions())
    if (!all.length) return
    const cur = all.findIndex(s => s.id === S.selected)
    focusIdx = (cur >= 0 ? cur : focusIdx) + by
    focusAt = Date.now()
    S.selected = null
    render()
  }
  $('f-prev').addEventListener('click', () => step(-1))
  $('f-next').addEventListener('click', () => step(1))
  window.__deckNow3d = () => (THREE_D.includes(S.view) ? { view: S.view, sessions: focus3d(scene3d(sessions()), Date.now()).shown } : null)
  window.__deckSelect = key => select(key)
  const loadedAt = Date.now()
  function show3d(list, now) {
    const note = $('three-note')
    const all = scene3d(list)
    const { shown, auto, i } = focus3d(all, now)
    const bar = $('three-bar')
    bar.hidden = all.length === 0
    if (all.length) {
      $('f-name').replaceChildren(shown[0].name, ' ', h('span', { class: 'mono' },
        (all.length > 1 ? (i + 1) + ' of ' + all.length : 'the only one active') +
        (auto ? ' · next in ' + Math.max(1, Math.ceil((CYCLE_MS - (now - focusAt)) / 1000)) + 's' : all.length > 1 ? ' · held' : '')))
      $('f-prev').hidden = $('f-next').hidden = all.length < 2
    }
    if (window.__deckScene) { note.hidden = !!all.length; if (!all.length) note.textContent = 'Nothing is working or waiting on you right now. Sessions show here while they are.'; window.__deckScene.show(S.view, shown); return }
    note.hidden = now - loadedAt < 8000
    note.textContent = 'The 3D layouts load three.js from the internet the first time, and it has not arrived. Orbit, Board and Lanes (4-6) work without it.'
  }

  function renderSummary(list, now) {
    const el = $('summary')
    if (!S.receivedAt) { el.textContent = 'Waiting for data…'; return }
    const work = list.filter(s => s.status === 'working').length
    const wait = list.filter(s => group(s.status) === 'wait').length
    const agents = list.reduce((n, s) => n + agentsOf(s).running.length, 0)
    const cloud = S.data && S.data.cloud
    el.replaceChildren(
      [plural(list.length, 'session'), work + ' working', wait + (wait === 1 ? ' needs you' : ' need you'), plural(agents, 'agent') + ' running'].join(' · '),
      ' · ',
      cloud ? h('span', { class: cloud.error ? 'warn' : '' }, 'cloud ' + (cloud.error ? 'not updating' : 'checked ' + ago(cloud.fetchedAt, now))) : 'cloud loading…')
  }

  function renderNotice(now) {
    const el = $('notice')
    const age = now - S.receivedAt
    const cloud = S.data && S.data.cloud
    let tone = null
    let text = ''
    if (!S.receivedAt) { tone = 'idle'; text = 'No Claude session is sending to this window yet. In a session, press Pop out on the Agent deck pane or type /agent-deck-window.' }
    else if (age > 8000) { tone = 'wait'; text = 'No update for ' + span(age) + '. Is a Claude session with the deck still open?' }
    else if (cloud && cloud.error) { tone = 'fail'; text = 'Cloud sessions: ' + cloud.error + (cloud.sessions.length ? ' Showing the last list.' : '') }
    el.hidden = !tone
    if (tone) el.replaceChildren(h('span', { class: 'dot t-' + tone }), h('p', null, text))
  }

  const shapeEl = s => h('span', { class: 'shape ' + s.place + (s.offline ? ' hollow' : '') + ' t-' + TONE[s.status], 'aria-hidden': 'true' })
  const placeText = s => s.place === 'local' ? (s.offline ? 'Local · offline' : 'Local') : 'Cloud'
  const when = (s, now) => s.fromPlugin ? 'open now' : ago(s.updatedAt, now)
  function select(key) { S.selected = S.selected === key ? null : key; render() }

  function renderRail(list, now) {
    const rail = $('rail')
    const s = S.selected && list.find(x => x.key === S.selected)
    if (s) { rail.replaceChildren(...detail(s, now)); return }

    const waiting = list.filter(x => group(x.status) === 'wait')
    const blocks = [h('section', null,
      h('h2', { class: 'eyebrow' }, h('span', { class: 'dot t-wait' }), 'Needs you'),
      waiting.length
        ? waiting.map(x => h('button', { class: 'row', onclick: () => select(x.key) },
            shapeEl(x), h('span', { class: 'clip' }, x.title), h('span', { class: 'mono' }, when(x, now)),
            h('span', { class: 'sub' }, x.needs || x.detail || LABEL[x.status])))
        : h('p', { class: 'empty' }, 'Nothing is waiting on you.'))]
    if ((S.view === 'orbit' || THREE_D.includes(S.view)) && list.length) {
      blocks.push(h('section', null,
        h('h2', { class: 'eyebrow' }, 'Sessions'),
        list.map(x => h('button', { class: 'row', onclick: () => select(x.key) },
          shapeEl(x), h('span', { class: 'clip' }, x.title),
          h('span', { class: 'mono' }, x.status === 'working' ? plural(agentsOf(x).running.length, 'agent') : when(x, now))))))
    }
    blocks.push(h('section', null,
      h('h2', { class: 'eyebrow' }, 'Key'),
      h('ul', { class: 'legend' },
        h('li', null, h('span', { class: 'shape cloud t-idle' }), 'Cloud session'),
        h('li', null, h('span', { class: 'shape local t-idle' }), 'Local session'),
        h('li', null, h('span', { class: 'shape local hollow t-idle' }), 'Computer offline'),
        h('li', null, h('span', { class: 'dot t-work' }), 'Working · agents'),
        h('li', null, h('span', { class: 'dot t-wait' }), 'Waiting for you'),
        h('li', null, h('span', { class: 'dot t-fail' }), 'Stopped with an error'),
        h('li', null, h('span', { class: 'dot t-done' }), 'Finished'),
        h('li', null, h('span', { class: 'dot t-idle' }), 'Idle'),
      ),
      h('p', { class: 'keys' }, h('span', { class: 'k' }, '1'), '–', h('span', { class: 'k' }, '6'), ' layouts  ', h('span', { class: 'k' }, 'R'), ' camera  ',
        h('span', { class: 'k' }, 'L'), ' list  ', h('span', { class: 'k' }, 'F'), ' fullscreen  ', h('span', { class: 'k' }, 'Esc'), ' close'),
    ))
    rail.replaceChildren(...blocks)
  }

  function agentLine(a, now) {
    if (a.status === 'idle') return 'Waiting for a message'
    const bits = [a.action || 'Starting up']
    if (a.startedAt) bits.push(span(now - a.startedAt))
    if (a.est && a.est.text) bits.push(a.est.text)
    return bits.join(' · ')
  }

  function detail(s, now) {
    const { running, finished } = agentsOf(s)
    const rows = [
      ['Where', s.place === 'local' ? (s.offline ? 'Your computer (offline)' : 'Your computer') : 'Cloud'],
      s.repo ? ['Project', s.repo + (s.branch ? ' · ' + s.branch : '')] : null,
      s.doing ? [s.status === 'working' ? 'Doing' : 'Last task', s.doing] : null,
      s.needs ? ['Needs you', s.needs, 'needs'] : null,
      s.detail ? ['Last turn', s.detail] : null,
      ['Updated', when(s, now)],
      s.createdAt ? ['Started', ago(s.createdAt, now)] : null,
      s.types.length ? ['Can start', s.types.join(' · ')] : null,
    ].filter(Boolean)
    const items = [
      ...running.map(a => h('li', null, h('span', { class: 'dot ' + (a.status === 'idle' ? 't-wait' : 't-work pulse') }),
        h('span', null, a.description || 'Agent', h('br'), h('span', { class: 'what' }, agentLine(a, now))))),
      ...finished.map(a => h('li', null, h('span', { class: 'dot t-' + (a.status === 'failed' ? 'fail' : a.status === 'stopped' ? 'idle' : 'done') }),
        h('span', { class: 'what' }, (a.description || 'Agent') + ' · ' + (a.status === 'failed' ? 'failed' : a.status === 'stopped' ? 'stopped' : 'finished') +
          (a.startedAt && a.endedAt ? ' · took ' + span(a.endedAt - a.startedAt) : '')))),
    ]
    return [
      h('div', { class: 'detail-head' },
        h('span', { class: 'pill' }, h('span', { class: 'dot t-' + TONE[s.status] + (s.status === 'working' ? ' pulse' : '') }), LABEL[s.status]),
        h('button', { class: 'btn', onclick: () => select(null) }, 'Close')),
      h('h2', { class: 'detail-title' }, s.title),
      h('dl', null, rows.map(([k, v, cls]) => [h('dt', null, k), h('dd', { class: cls || '' }, v)])),
      h('section', null,
        h('h2', { class: 'eyebrow' }, 'Agents'),
        items.length ? h('ul', { class: 'agents' }, items)
          : h('p', { class: 'empty' }, s.status === 'working' ? 'No agents seen yet.' : 'Agents show here while the session is working.')),
      s.cloudId ? h('a', { class: 'open', href: 'https://claude.ai/code/' + encodeURIComponent(s.cloudId), target: '_blank', rel: 'noopener' }, 'Open on claude.ai ↗') : null,
    ]
  }

  // ---------- Board ----------
  function renderBoard(list, now) {
    const cols = [
      ['work', 'Working', list.filter(s => group(s.status) === 'work'), 'Nothing is running right now.'],
      ['wait', 'Needs you', list.filter(s => group(s.status) === 'wait'), 'Nothing is waiting on you.'],
      ['idle', 'Recent', list.filter(s => group(s.status) === 'recent'), S.range === 'day' ? 'No other sessions today.' : 'No other sessions this week.'],
    ]
    $('board').replaceChildren(h('div', { class: 'cols' }, cols.map(([t, name, items, none]) =>
      h('div', { class: 'col' },
        h('div', { class: 'col-head' }, h('span', { class: 'dot t-' + t }), h('h2', { class: 'eyebrow' }, name), h('span', { class: 'mono' }, String(items.length))),
        items.length ? items.map(s => card(s, now)) : h('p', { class: 'empty' }, none)))))
  }

  function card(s, now) {
    const { running, finished } = agentsOf(s)
    const line = s.needs
      ? h('div', { class: 'card-line needs' }, s.needs)
      : h('div', { class: 'card-line' }, s.status === 'working' ? s.doing || 'Working' : s.detail || s.doing || LABEL[s.status])
    const rows = [
      ...running.map(a => h('li', null, h('span', { class: 'dot ' + (a.status === 'idle' ? 't-wait' : 't-work pulse') }),
        h('span', { class: 'clip' }, a.description || 'Agent', ' ', h('span', { class: 'what' }, '· ' + (a.status === 'idle' ? 'waiting' : a.action || 'starting up'))))),
      ...finished.slice(0, 2).map(a => h('li', null, h('span', { class: 'dot t-' + (a.status === 'failed' ? 'fail' : 'done') }), h('span', { class: 'clip what' }, a.description || 'Agent'))),
    ]
    return h('button', { class: 'card' + (S.selected === s.key ? ' sel' : ''), onclick: () => select(s.key) },
      h('div', { class: 'card-top' }, shapeEl(s), h('span', { class: 'tag' }, placeText(s)), h('span', { class: 'mono' }, when(s, now))),
      h('div', { class: 'card-title' }, s.title),
      s.repo && s.repo !== s.title ? h('div', { class: 'mono clip' }, s.repo + (s.branch ? ' · ' + s.branch : '')) : null,
      line,
      rows.length ? h('ul', { class: 'agents' }, rows) : null)
  }

  // ---------- Lanes ----------
  function renderLanes(list, now) {
    const from = now - LANE_MS
    const x = t => Math.max(0, Math.min(100, ((t - from) / LANE_MS) * 100))
    const head = h('div', { class: 'lanes-head' }, h('div', { class: 'spacer mono' }, 'Session'),
      h('div', { class: 'axis' }, ['60m ago', '45m', '30m', '15m', 'now'].map((t, i) => h('span', { style: 'left:' + (i * 25) + '%' }, t))))
    const lanes = list.map(s => {
      const marks = []
      for (const t of s.activity) if (t >= from) marks.push(h('span', { class: 'tick' + (now - t < 120e3 ? ' hot' : ''), style: 'left:' + x(t) + '%' }))
      const { running, finished } = agentsOf(s)
      const runs = [...running, ...finished].filter(a => a.startedAt && (isLive(a) || (a.endedAt || a.startedAt) >= from)).slice(0, 6)
      runs.forEach((a, i) => {
        const end = isLive(a) ? now : Math.max(a.endedAt || 0, a.startedAt + 30e3)
        const left = x(a.startedAt)
        const width = Math.max(1.2, x(end) - left)
        const cls = isLive(a) ? 'live' : a.status === 'failed' ? 'bad' : 'end'
        marks.push(h('span', { class: 'run ' + cls, style: 'left:' + left + '%;width:' + width + '%;top:' + (21 + (i % 2) * 15) + 'px', title: a.description }, a.description || 'Agent'))
      })
      if (!s.activity.length && !s.fromPlugin && s.updatedAt >= from) marks.push(h('span', { class: 'mark', style: 'left:' + x(s.updatedAt) + '%' }))
      if (s.status === 'working') marks.push(h('span', { class: 'nowcap pulse' }))
      if (!marks.length) marks.push(h('span', { class: 'when' }, s.fromPlugin ? 'open, quiet' : 'last active ' + ago(s.updatedAt, now)))
      return h('button', { class: 'lane' + (S.selected === s.key ? ' sel' : ''), onclick: () => select(s.key) },
        h('div', { class: 'lane-label' },
          h('div', { class: 'lane-name' }, shapeEl(s), h('span', { class: 'clip' }, s.title)),
          h('div', { class: 'mono clip' }, placeText(s) + ' · ' + LABEL[s.status] + (s.repo && s.repo !== s.title ? ' · ' + s.repo : ''))),
        h('div', { class: 'track' }, marks))
    })
    $('lanes').replaceChildren(h('div', { class: 'lanes' }, head, lanes.length ? lanes : h('p', { class: 'empty' }, 'No sessions in this range.')))
  }

  // ---------- Orbit (canvas) ----------
  const cv = $('orbit')
  const ctx = cv.getContext('2d')
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)')
  const col = {}
  let hits = []
  let hovered = null
  let orbitRunning = false
  let cachedList = []
  let cachedAt = 0

  function readColors() {
    const cs = getComputedStyle(document.documentElement)
    for (const k of ['panel', 'raise', 'line', 'fg', 'dim', 'faint', 'accent', 'work', 'wait', 'done', 'fail', 'idle']) col[k] = cs.getPropertyValue('--' + k).trim()
  }
  function alpha(hex, a) {
    const m = /^#([0-9a-f]{6})$/i.exec(hex || '')
    if (!m) return hex
    const n = parseInt(m[1], 16)
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'
  }
  function ensureOrbit() {
    if (orbitRunning || S.view !== 'orbit') return
    orbitRunning = true
    requestAnimationFrame(frame)
  }
  function frame(t) {
    if (S.view !== 'orbit' || document.hidden) { orbitRunning = false; return }
    drawOrbit(reduceMotion.matches ? 0 : t / 1000)
    requestAnimationFrame(frame)
  }
  function shapePath(place, x, y, r) {
    ctx.beginPath()
    if (place === 'local') {
      if (ctx.roundRect) ctx.roundRect(x - r, y - r, r * 2, r * 2, r * 0.3)
      else ctx.rect(x - r, y - r, r * 2, r * 2)
    } else ctx.arc(x, y, r, 0, Math.PI * 2)
  }
  function label(text, x, y, font, color) {
    ctx.font = font
    ctx.lineWidth = 4
    ctx.lineJoin = 'round'
    ctx.strokeStyle = alpha(col.panel, 0.92)
    ctx.strokeText(text, x, y)
    ctx.fillStyle = color
    ctx.fillText(text, x, y)
  }

  function drawOrbit(sec) {
    const dpr = Math.min(2, devicePixelRatio || 1)
    const W = cv.clientWidth
    const H = cv.clientHeight
    if (!W || !H) return
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr) }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.clearRect(0, 0, W, H)

    const now = Date.now()
    if (now - cachedAt > 500) { cachedList = sessions(now); cachedAt = now }
    const list = cachedList
    const compact = W < 640
    const cx = W / 2
    const cy = H / 2 + (compact ? 22 : 14)
    const padX = compact ? 46 : 190
    const padY = compact ? 150 : 130
    const tilt = Math.max(0.5, Math.min(0.92, (H - padY) / Math.max(1, W - padX)))
    const R = Math.max(70, Math.min((W - padX) / 2, (H - padY) / 2 / tilt))
    const rings = [
      { key: 'work', r: R * 0.36, name: 'WORKING', speed: 1 / 240, size: 13 },
      { key: 'wait', r: R * 0.67, name: 'NEEDS YOU', speed: -1 / 360, size: 11 },
      { key: 'recent', r: R, name: 'RECENT', speed: 1 / 720, size: 8 },
    ]

    for (const ring of rings) {
      ctx.beginPath()
      ctx.ellipse(cx, cy, ring.r, ring.r * tilt, 0, 0, Math.PI * 2)
      ctx.strokeStyle = ring.key === 'work' ? alpha(col.work, 0.35) : ring.key === 'wait' ? alpha(col.wait, 0.22) : col.line
      ctx.lineWidth = ring.key === 'work' ? 1.5 : 1
      ctx.setLineDash(ring.key === 'recent' ? [3, 5] : [])
      ctx.stroke()
      ctx.setLineDash([])
    }
    // Which ring is which, in the corner rather than on the rings, so planets never sit on it.
    ctx.textAlign = 'left'
    ctx.textBaseline = 'middle'
    rings.forEach((ring, i) => {
      const y0 = 22 + i * 17
      ctx.beginPath()
      ctx.ellipse(24, y0, 7, 7 * 0.6, 0, 0, Math.PI * 2)
      ctx.strokeStyle = ring.key === 'work' ? col.work : ring.key === 'wait' ? col.wait : col.faint
      ctx.lineWidth = 1.5
      ctx.setLineDash(ring.key === 'recent' ? [2, 2] : [])
      ctx.stroke()
      ctx.setLineDash([])
      ctx.font = '500 10px JetBrains Mono, ui-monospace, monospace'
      ctx.fillStyle = col.faint
      ctx.fillText((i === 0 ? 'INNER · ' : i === 1 ? 'MIDDLE · ' : 'OUTER · ') + ring.name, 38, y0 + 1)
    })
    ctx.textBaseline = 'alphabetic'

    const placed = []
    for (const ring of rings) {
      const items = list.filter(s => group(s.status) === ring.key)
      const n = items.length
      const turn = sec * ring.speed * Math.PI * 2
      items.forEach((s, j) => {
        const a = -Math.PI / 2 + turn + (j * Math.PI * 2) / Math.max(1, n) + (ring.key === 'wait' ? Math.PI / Math.max(2, n) : 0)
        const depth = Math.sin(a)
        placed.push({ s, ring, n, x: cx + ring.r * Math.cos(a), y: cy + ring.r * Math.sin(a) * tilt, depth, r: ring.size * (1 + 0.14 * depth) })
      })
    }

    for (const p of placed) {
      if (p.ring.key !== 'work') continue
      ctx.beginPath()
      ctx.moveTo(cx, cy)
      ctx.lineTo(p.x, p.y)
      ctx.strokeStyle = alpha(col.work, 0.45)
      ctx.lineWidth = 1
      ctx.setLineDash([2, 7])
      ctx.lineDashOffset = -sec * 14
      ctx.stroke()
      ctx.setLineDash([])
    }

    ctx.beginPath()
    ctx.arc(cx, cy, 24, 0, Math.PI * 2)
    ctx.fillStyle = col.raise
    ctx.fill()
    ctx.strokeStyle = col.line
    ctx.lineWidth = 1
    ctx.stroke()
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.font = '600 12px Chakra Petch, ui-sans-serif, sans-serif'
    ctx.fillStyle = col.dim
    ctx.fillText('YOU', cx, cy + 1)
    ctx.textBaseline = 'alphabetic'

    hits = []
    placed.sort((a, b) => a.depth - b.depth)
    const pulse = 0.5 + 0.5 * Math.sin(sec * 3)
    for (const p of placed) {
      const { s, x, y, r } = p
      const c = col[TONE[s.status]] || col.idle
      const isSel = S.selected === s.key
      const isHover = hovered === s.key
      const running = s.status === 'working' ? agentsOf(s).running : []

      if (running.length) {
        ctx.beginPath()
        ctx.ellipse(x, y, r + 15, (r + 15) * 0.55, 0, 0, Math.PI * 2)
        ctx.strokeStyle = alpha(col.work, 0.25)
        ctx.lineWidth = 1
        ctx.stroke()
      }
      if (s.status === 'working' || group(s.status) === 'wait') {
        shapePath(s.place, x, y, r + 4 + pulse * 4)
        ctx.strokeStyle = alpha(c, 0.15 + 0.25 * (1 - pulse))
        ctx.lineWidth = 2
        ctx.stroke()
      }
      ctx.save()
      if (s.status === 'working') { ctx.shadowColor = c; ctx.shadowBlur = 14 + 8 * pulse }
      shapePath(s.place, x, y, r)
      if (s.offline) { ctx.lineWidth = 2.5; ctx.strokeStyle = c; ctx.stroke() }
      else { ctx.fillStyle = group(s.status) === 'recent' ? alpha(c, 0.75) : c; ctx.fill() }
      ctx.restore()
      if (isSel || isHover) {
        shapePath(s.place, x, y, r + 5)
        ctx.strokeStyle = isSel ? col.accent : col.fg
        ctx.lineWidth = 1.5
        ctx.stroke()
      }

      // Agents as moons: white while running, amber while waiting for a message.
      running.forEach((a, k) => {
        const ang = sec * (Math.PI * 2 / 7) + (k * Math.PI * 2) / running.length
        const mx = x + (r + 15) * Math.cos(ang)
        const my = y + (r + 15) * 0.55 * Math.sin(ang)
        ctx.save()
        ctx.shadowColor = a.status === 'idle' ? col.wait : col.work
        ctx.shadowBlur = 8
        ctx.beginPath()
        ctx.arc(mx, my, 3.4, 0, Math.PI * 2)
        ctx.fillStyle = a.status === 'idle' ? col.wait : col.fg
        ctx.fill()
        ctx.restore()
      })

      const showLabel = isSel || isHover || (compact ? p.ring.key === 'work' : (p.ring.key !== 'recent' || p.n <= 9))
      if (showLabel) {
        const max = compact ? 20 : p.ring.key === 'recent' ? 22 : 28
        // Upper half of a ring: label above the planet, so it never runs into the hub or an inner ring.
        const above = p.depth < -0.25
        const gap = r + (running.length ? 14 : 6)
        ctx.textAlign = 'center'
        label(clip(s.title, isHover || isSel ? 60 : max), x, above ? y - gap - 16 : y + gap + 11,
          '600 12px Figtree, ui-sans-serif, sans-serif', p.ring.key === 'recent' && !isHover && !isSel ? col.dim : col.fg)
        const sub = (s.place === 'local' ? (s.offline ? 'LOCAL · OFFLINE' : 'LOCAL') : 'CLOUD') + ' · ' +
          (running.length ? plural(running.length, 'agent').toUpperCase() : when(s, now).toUpperCase())
        label(sub, x, above ? y - gap - 3 : y + gap + 25, '500 9.5px JetBrains Mono, ui-monospace, monospace', col.faint)
      }
      hits.push({ key: s.key, x, y, r: r + 10 })
    }

    if (!list.length) {
      ctx.textAlign = 'center'
      label(S.receivedAt ? (S.range === 'day' ? 'No sessions in the last day' : 'No sessions this week') : 'Waiting for data…',
        cx, cy + 52, '500 13px Figtree, ui-sans-serif, sans-serif', col.dim)
    }
  }

  function hitAt(ev) {
    const rect = cv.getBoundingClientRect()
    const x = ev.clientX - rect.left
    const y = ev.clientY - rect.top
    let best = null
    let bestD = Infinity
    for (const p of hits) {
      const d = Math.hypot(p.x - x, p.y - y)
      if (d <= p.r && d < bestD) { best = p.key; bestD = d }
    }
    return best
  }
  cv.addEventListener('pointermove', ev => { hovered = hitAt(ev); cv.style.cursor = hovered ? 'pointer' : 'default' })
  cv.addEventListener('pointerleave', () => { hovered = null })
  cv.addEventListener('click', ev => { const k = hitAt(ev); if (k) select(k); else if (S.selected) select(null) })

  // ---------- controls ----------
  function setView(v) { S.view = v; store.set('deck.view', v); render() }
  function setRange(r) { S.range = r; store.set('deck.range', r); cachedAt = 0; render() }
  function toggleRail() { const off = document.body.classList.toggle('norail'); store.set('deck.norail', off ? '1' : '0') }
  function fullscreen() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {})
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {})
  }
  $('views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view) })
  $('ranges').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setRange(b.dataset.range) })
  $('list').addEventListener('click', toggleRail)
  $('cam').addEventListener('click', () => window.__deckScene && window.__deckScene.toggleRotate())
  $('full').addEventListener('click', fullscreen)
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return
    const k = e.key.toLowerCase()
    if (/^[1-6]$/.test(k)) setView(VIEWS[Number(k) - 1])
    else if (k === 'r') window.__deckScene && window.__deckScene.toggleRotate()
    else if ((k === '[' || k === 'arrowleft') && THREE_D.includes(S.view)) step(-1)
    else if ((k === ']' || k === 'arrowright') && THREE_D.includes(S.view)) step(1)
    else if (k === 't') setView(VIEWS[(VIEWS.indexOf(S.view) + 1) % VIEWS.length])
    else if (k === 'l') toggleRail()
    else if (k === 'f') fullscreen()
    else if (k === 'escape' && S.selected) select(null)
  })
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render() })
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render)

  readColors()
  poll()
  render()
  setInterval(() => { poll(); render() }, 1000)
})()
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
// The 3D layouts (Decks, Circuit, Workshop). Loaded from the internet the first time; the other layouts work without it.
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`)
const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s }
const fmt = ms => {
  const s = Math.max(0, Math.round(ms / 1000))
  if (s < 60) return `${s}s`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`
}
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches

const COLOR = {
  running: 0x37d7ff, idle: 0xf5b14c, done: 0x3ddc84, failed: 0xff5c7a, stopped: 0x9aa4b2,
  type: 0x7b86a6, main: 0xb48cff, mainOff: 0x5d6280, rim: 0x3a7bff,
}

// --- Renderer, camera, effects, sized to the stage ---------------------------
const host = document.getElementById('three')
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
host.prepend(renderer.domElement)

const labels = new CSS2DRenderer({ element: document.getElementById('three-labels') })
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1200)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.autoRotateSpeed = 0.45
controls.maxPolarAngle = Math.PI * 0.47
controls.minDistance = 5
controls.maxDistance = 160

let rotateWanted = !calm
let interacting = false
let resumeTimer = 0
let zoomed = false
controls.addEventListener('start', () => { interacting = true; controls.autoRotate = false; clearTimeout(resumeTimer) })
controls.addEventListener('end', () => {
  resumeTimer = setTimeout(() => { interacting = false; controls.autoRotate = theme ? circling() : false }, 8000)
})
renderer.domElement.addEventListener('wheel', () => { zoomed = true }, { passive: true })

const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.7, 0.5, 0.22)
composer.addPass(bloom)
composer.addPass(new OutputPass())

// --- Small shared helpers ---------------------------------------------------
const shared = g => { g.userData.shared = true; return g }
const GEO = {
  box: shared(new THREE.BoxGeometry(1, 1, 1)),
  boxUp: shared(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0)),
  edgesUp: shared(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0))),
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15, ...o })
const glow = (color, o = {}) => new THREE.MeshBasicMaterial({ color, ...o })
function cube(w, h, d, material, y = h / 2) {
  const m = new THREE.Mesh(GEO.box, material)
  m.scale.set(w, h, d)
  m.position.y = y
  return m
}
const isLive = a => a.status === 'running' || a.status === 'idle'
const liveOf = s => s.agents.filter(isLive)
const doneOf = s => s.agents.filter(a => !isLive(a))
const tint = a => (a.status === 'idle' ? COLOR.idle : COLOR.running)
const fraction = a => (typeof a.est?.fraction === 'number' ? Math.max(0, Math.min(1, a.est.fraction)) : null)
const easeTo = (cur, target, dt, rate = 4) => cur + (target - cur) * (1 - Math.exp(-rate * dt))

function label(html, cls) {
  const el = document.createElement('div')
  el.className = `lbl ${cls}`
  el.innerHTML = html
  return new CSS2DObject(el)
}

function agentHtml(a, now, { meta = true } = {}) {
  const f = fraction(a)
  const pct = f === null ? '' : ` · ${Math.round(f * 100)}%`
  const elapsed = a.startedAt ? fmt(now - a.startedAt) : 'since before the deck loaded'
  return `<div class="n">#${a.n}${pct}</div><div class="d">${esc(a.description)}</div>` +
    `<div class="a">${a.status === 'idle' ? 'Waiting for a message' : esc(a.action || 'Starting up')}</div>` +
    (meta ? `<div class="m">${elapsed} · ${esc(a.est?.text ?? '')}</div>` : '') +
    `<div class="pb${f === null ? ' unknown' : ''}"><i style="width:${Math.round((f ?? 0.3) * 100)}%"></i></div>`
}
function setAgentLabel(tag, a, now, opts) {
  tag.element.className = `lbl agent ${a.status}`
  tag.element.innerHTML = agentHtml(a, now, opts)
}
function finishedSummary(list) {
  if (list.length === 0) return ''
  const count = st => list.filter(a => a.status === st).length
  const parts = [['done', '✓'], ['failed', '✕'], ['stopped', '■']].filter(([st]) => count(st)).map(([st, m]) => `${m} ${count(st)}`)
  return `<b>FINISHED</b> ${parts.join(' · ')}<br>${list.slice(0, 4).map(a => esc(a.description)).join('<br>')}`
}
const typesHtml = (types, place) => `<b>READY TO START</b><br>${types.slice(0, 8).map(esc).join(' · ') ||
  (place === 'cloud' ? 'not reported for cloud sessions' : 'listed after the first turn')}`
const hubText = s => (s.main.needs ? `Needs you · ${esc(clip(s.main.needs, 70))}`
  : s.main.isWorking ? `Working · ${esc(clip(s.main.action || 'on it', 70))}` : 'Waiting for your next message')
const hubClass = s => `lbl hub${s.main.needs ? ' need' : s.main.isWorking ? '' : ' off'}`
const nameHtml = s => `${esc(clip(s.name, 44))} <span class="place">${s.place === 'cloud' ? 'cloud' : 'local'}</span>`

function disposeTree(obj) {
  obj.traverse(o => {
    if (o.isCSS2DObject) o.element.remove()
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose()
    const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : []
    for (const m of mats) if (!m.userData.shared) m.dispose()
  })
}

/** Adds what is new and removes what is gone, keyed by `id`; `make` returns { group, ... }. */
function sync(map, list, make, parent) {
  const ids = new Set(list.map(x => x.id))
  for (const [id, item] of map) {
    if (!ids.has(id)) {
      disposeTree(item.group)
      parent.remove(item.group)
      map.delete(id)
    }
  }
  for (const x of list) {
    if (map.has(x.id)) continue
    const item = make(x)
    parent.add(item.group)
    map.set(x.id, item)
  }
}

function ringPositions(count, radius, offset) {
  if (count === 1 && radius < 4) return [[0, radius]]
  return Array.from({ length: count }, (_, i) => {
    const a = offset + (i / count) * Math.PI * 2
    return [Math.cos(a) * radius, Math.sin(a) * radius]
  })
}

function seeded(text) {
  let h = 2166136261
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619)
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822507)
    h = Math.imul(h ^ (h >>> 13), 3266489909)
    return ((h ^= h >>> 16) >>> 0) / 4294967296
  }
}

/** A sky dome shaded from horizon to zenith. */
function skyDome(stops) {
  const g = new THREE.SphereGeometry(600, 48, 24)
  const pos = g.attributes.position
  const colors = []
  const c = new THREE.Color()
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 600
    let j = 0
    while (j < stops.length - 2 && y > stops[j + 1][0]) j++
    const [y0, c0] = stops[j]
    const [y1, c1] = stops[j + 1]
    const k = Math.max(0, Math.min(1, (y - y0) / (y1 - y0)))
    c.set(c0).lerp(new THREE.Color(c1), k)
    colors.push(c.r, c.g, c.b)
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }))
}

/** A flat arc on the floor: `part` of a full turn, from 12 o'clock clockwise. */
function arcGeometry(inner, outer, part) {
  const len = Math.max(0.001, Math.min(1, part)) * Math.PI * 2
  return new THREE.RingGeometry(inner, outer, 64, 1, Math.PI / 2 - len, len).rotateX(-Math.PI / 2)
}

// ============================================================================
// Theme 1: DECKS. A DJ booth per session. Every working agent is a turntable:
// the record spins while it works and the tonearm crosses the record as it
// gets through its steps. The main session is the mixer, its meters moving
// while it works. Finished agents and ready agent types are record crates.
// ============================================================================
function makeTurntable() {
  const group = new THREE.Group()
  group.position.y = 1.0
  group.scale.setScalar(0.01)
  const metal = std(0x2a2836, { metalness: 0.55, roughness: 0.38 })
  group.add(cube(2.3, 0.16, 2.3, metal, 0.08))
  const platter = new THREE.Mesh(new THREE.CylinderGeometry(1.02, 1.02, 0.06, 64), std(0xa7adbf, { metalness: 0.85, roughness: 0.28 }))
  platter.position.y = 0.19
  group.add(platter)

  const record = new THREE.Group()
  record.position.y = 0.235
  group.add(record)
  record.add(new THREE.Mesh(new THREE.CylinderGeometry(0.97, 0.97, 0.025, 64), std(0x060608, { roughness: 0.22, metalness: 0.35 })))
  const grooveMat = glow(0x2c2c3a)
  for (const r of [0.5, 0.66, 0.82]) {
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.005, r + 0.005, 64).rotateX(-Math.PI / 2), grooveMat)
    ring.position.y = 0.014
    record.add(ring)
  }
  const labelMat = std(COLOR.running, { emissive: COLOR.running, emissiveIntensity: 0.7 })
  const centre = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.03, 32), labelMat)
  centre.position.y = 0.006
  record.add(centre)
  const mark = cube(0.16, 0.012, 0.05, glow(0xffffff), 0.025)
  mark.position.x = 0.16
  record.add(mark)

  const trackMat = glow(0x232a44)
  const track = new THREE.Mesh(new THREE.RingGeometry(1.06, 1.13, 64).rotateX(-Math.PI / 2), trackMat)
  track.position.y = 0.165
  group.add(track)
  const arcMat = glow(COLOR.running)
  const arc = new THREE.Mesh(arcGeometry(1.06, 1.13, 0.001), arcMat)
  arc.position.y = 0.167
  group.add(arc)

  const pivot = new THREE.Group()
  pivot.position.set(0.95, 0.2, -0.95)
  group.add(pivot)
  const silver = std(0xd7dbe6, { metalness: 0.9, roughness: 0.25 })
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.22, 20), silver)
  post.position.y = 0.06
  pivot.add(post)
  const arm = cube(0.045, 0.045, 1.42, silver, 0.17)
  arm.position.z = 0.71
  pivot.add(arm)
  const head = cube(0.13, 0.05, 0.22, std(0x101015), 0.15)
  head.position.z = 1.45
  pivot.add(head)

  const tag = label('', 'agent')
  tag.position.y = 2.1
  group.add(tag)

  let known = false
  let f = 0
  let lastPart = -1
  let spin = 3.6
  let angle = -0.02
  let phase = Math.random() * 10
  return {
    group,
    update(a, now, row) {
      const colour = tint(a)
      labelMat.color.setHex(colour)
      labelMat.emissive.setHex(colour)
      arcMat.color.setHex(colour)
      const got = fraction(a)
      known = got !== null
      f = got ?? 0
      const part = known ? Math.round(f * 100) / 100 : 0.25
      if (part !== lastPart) {
        arc.geometry.dispose()
        arc.geometry = arcGeometry(1.06, 1.13, part)
        lastPart = part
      }
      spin = a.status === 'idle' ? 0.5 : 3.6
      tag.position.y = row % 2 ? 2.9 : 2.0
      setAgentLabel(tag, a, now, { meta: false })
    },
    tick(dt, t) {
      group.scale.setScalar(easeTo(group.scale.x, 1, dt, 5))
      if (!calm) record.rotation.y -= dt * spin
      if (!known && !calm) arc.rotation.y -= dt * 1.4
      else arc.rotation.y = 0
      const p = known ? f : 0.5 + 0.08 * Math.sin(t * 0.7 + phase)
      angle = easeTo(angle, -0.08 - 0.44 * p, dt, 2)
      pivot.rotation.y = angle
    },
  }
}

function makeCrate(colorFor) {
  const group = new THREE.Group()
  const wood = std(0x3a2a1e, { roughness: 0.8 })
  group.add(cube(1.25, 0.08, 1.25, wood, 0.04))
  for (const [x, z, w, d] of [[0, 0.6, 1.25, 0.06], [0, -0.6, 1.25, 0.06], [0.6, 0, 0.06, 1.25], [-0.6, 0, 0.06, 1.25]]) {
    const wall = cube(w, 0.55, d, wood, 0.3)
    wall.position.x = x
    wall.position.z = z
    group.add(wall)
  }
  const sleeves = new THREE.Group()
  group.add(sleeves)
  const tag = label('', 'board')
  tag.position.y = 1.9
  group.add(tag)
  let lastKey = ''
  return {
    group,
    tag,
    fill(items) {
      const key = items.map(i => `${i.id}:${i.status ?? ''}`).join('|')
      if (key === lastKey) return
      lastKey = key
      disposeTree(sleeves)
      sleeves.clear()
      items.slice(0, 9).forEach((item, i) => {
        const colour = colorFor(item)
        const sleeve = cube(1.0, 1.0, 0.035, std(colour, { emissive: colour, emissiveIntensity: 0.25, roughness: 0.5 }), 0.58)
        sleeve.position.z = 0.42 - i * 0.1
        sleeve.rotation.x = -0.18
        sleeves.add(sleeve)
      })
    },
  }
}

function decksUnit() {
  const group = new THREE.Group()
  const table = cube(8, 1.0, 2.6, std(0x15121f, { roughness: 0.42, metalness: 0.5 }))
  group.add(table)
  const strip = cube(8, 0.05, 0.05, glow(0x37d7ff), 0.98)
  strip.position.z = 1.31
  const stripLow = cube(8, 0.04, 0.04, glow(0xff2bd6), 0.06)
  stripLow.position.z = 1.31
  group.add(strip, stripLow)

  // The mixer: the main session.
  const mixer = new THREE.Group()
  mixer.position.y = 1.0
  group.add(mixer)
  mixer.add(cube(1.8, 0.22, 2.1, std(0x23212f, { metalness: 0.6, roughness: 0.35 }), 0.11))
  const knobMat = std(0xd0d4e0, { metalness: 0.8, roughness: 0.3 })
  const knobGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.09, 16)
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 4; c++) {
      const k = new THREE.Mesh(knobGeo, knobMat)
      k.position.set(-0.6 + c * 0.4, 0.27, -0.15 + r * 0.32)
      mixer.add(k)
    }
  }
  const faderMat = std(0x0c0c12)
  for (let c = 0; c < 4; c++) {
    const slot = cube(0.05, 0.02, 0.5, faderMat, 0.23)
    slot.position.set(-0.6 + c * 0.4, 0, 0.8)
    mixer.add(slot)
  }
  const meterMat = glow(COLOR.main)
  const meters = Array.from({ length: 10 }, (_, i) => {
    const bar = new THREE.Mesh(GEO.boxUp, meterMat)
    bar.scale.set(0.1, 0.05, 0.1)
    bar.position.set(-0.72 + i * 0.16, 0.22, -0.78)
    mixer.add(bar)
    return bar
  })
  const hubTag = label('', 'hub')
  hubTag.position.set(0, -0.15, 1.75)
  mixer.add(hubTag)

  const finCrate = makeCrate(a => COLOR[a.status] ?? COLOR.stopped)
  const typeCrate = makeCrate(() => COLOR.type)
  group.add(finCrate.group, typeCrate.group)
  const nameTag = label('', 'sname')
  nameTag.position.set(0, 0.25, 2.2)
  group.add(nameTag)

  const decks = new Map()
  let working = false
  let half = 4
  return {
    group,
    update(s, now) {
      working = s.main.isWorking
      meterMat.color.setHex(working ? COLOR.main : COLOR.mainOff)
      hubTag.element.className = hubClass(s)
      hubTag.element.innerHTML = hubText(s)
      nameTag.element.innerHTML = nameHtml(s)

      const live = liveOf(s)
      sync(decks, live, () => makeTurntable(), group)
      live.forEach((a, i) => {
        const side = i % 2 === 0 ? 1 : -1
        const deck = decks.get(a.id)
        deck.goal = side * (2.3 + Math.floor(i / 2) * 2.6)
        deck.update(a, now, Math.floor(i / 2))
      })
      half = Math.max(3.6, 2.3 + Math.floor(Math.max(0, live.length - 1) / 2) * 2.6 + 1.35)

      const fin = doneOf(s)
      finCrate.fill(fin)
      finCrate.tag.element.innerHTML = finishedSummary(fin)
      finCrate.group.visible = finCrate.tag.visible = fin.length > 0
      typeCrate.fill(s.types.map(name => ({ id: name })))
      typeCrate.tag.element.innerHTML = typesHtml(s.types, s.place)
      typeCrate.group.visible = typeCrate.tag.visible = s.types.length > 0
    },
    tick(dt, t) {
      const w = easeTo(table.scale.x, half * 2, dt, 3)
      table.scale.x = strip.scale.x = stripLow.scale.x = w
      finCrate.group.position.set(-(w / 2 + 1.3), 0, 0.6)
      typeCrate.group.position.set(w / 2 + 1.3, 0, 0.6)
      meters.forEach((bar, i) => {
        const level = working && !calm ? 0.08 + 0.5 * Math.abs(Math.sin(t * 5.5 + i * 0.8)) * (0.55 + 0.45 * Math.sin(t * 2.1 + i)) : 0.04
        bar.scale.y = easeTo(bar.scale.y, level, dt, 12)
      })
      for (const deck of decks.values()) {
        deck.group.position.x = easeTo(deck.group.position.x, deck.goal ?? 0, dt, 3)
        deck.tick(dt, t)
      }
    },
  }
}
